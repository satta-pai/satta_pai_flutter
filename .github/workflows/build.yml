name: Auto Unzip & Build Flutter Hybrid App + Web

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  unzip_and_build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Auto-Unzip Folders into GitHub Repo
        run: |
          if [ -f "satta_pai_flutter_arena.zip" ]; then
            unzip -o satta_pai_flutter_arena.zip
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .
            git commit -m "Auto-extracted Flutter folders from zip" || true
            git push || true
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build Hybrid Web & Android APK
        run: |
          flutter create . --project-name satta_pai_arena
          flutter pub get
          flutter build web --release
          flutter build apk --release --obfuscate --split-debug-info=build/debug-info

      - name: Downloadable Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Satta-Pai-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Downloadable Web Build
        uses: actions/upload-artifact@v4
        with:
          name: Satta-Pai-Website-Files
          path: build/web/
