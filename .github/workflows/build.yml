name: Auto Unzip & Build Satta Pai Hybrid App + Web

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  unzip_and_build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # Unzip if you have a zip file
      - name: Unzip Project Files
        run: |
          if [ -f "satta_pai_flutter.zip" ]; then
            unzip -o satta_pai_flutter.zip
          fi

      - name: Install Dependencies
        run: flutter pub get

      # Debug step: To see what files are actually present in the runner
      - name: List files in Root
        run: ls -la

      - name: Build Satta Pai Android APK & Web Bundle
        run: |
          # Create web directory
          mkdir -p web
          
          # Check where index.html is and copy it
          if [ -f "index.html" ]; then
            echo "Found index.html in root folder. Copying..."
            cp -f index.html web/index.html
          elif [ -f "assets/www/index.html" ]; then
            echo "Found index.html in assets/www folder. Copying..."
            cp -f assets/www/index.html web/index.html
          else
            echo "Warning: Custom index.html not found! Using Flutter default."
          fi

          # Build Web
          flutter build web --release
          
          # Build APK
          flutter build apk --release

      - name: Downloadable Satta Pai Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Satta-Pai-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Downloadable Satta Pai Website Files
        uses: actions/upload-artifact@v4
        with:
          name: Satta-Pai-Website-Files
          path: build/web/
