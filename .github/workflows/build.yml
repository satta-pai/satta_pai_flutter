name: Auto Unzip & Build Satta Pai Hybrid App + Web

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  unzip_and_build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Clean Repo & Build Satta Pai Hybrid App + Website
        run: |
          set -e
          rm -rf /tmp/sp_bundle /tmp/sp_upload.zip
          ZIP_PATH=""
          for z in *.zip; do
            if [ -f "$z" ] && unzip -l "$z" | grep -q "setup_hybrid_arena.py"; then
              ZIP_PATH="$z"
            fi
          done
          if [ -z "$ZIP_PATH" ]; then
            for z in *.zip; do
              if [ -f "$z" ] && unzip -l "$z" | grep -q "assets/www/index.html"; then
                ZIP_PATH="$z"
              fi
            done
          fi
          if [ -z "$ZIP_PATH" ]; then
            ZIP_PATH=$(ls -1 *.zip 2>/dev/null | head -n 1 || true)
          fi
          echo "Using uploaded bundle: $ZIP_PATH"
          cp -f "$ZIP_PATH" /tmp/sp_upload.zip
          mkdir -p /tmp/sp_bundle
          unzip -q -o /tmp/sp_upload.zip -d /tmp/sp_bundle

          rm -rf lib android ios web linux macos windows test build pubspec.yaml pubspec.lock analysis_options.yaml .metadata

          flutter create . --project-name satta_pai_arena --platforms=android,web
          rm -rf test/widget_test.dart

          flutter pub add webview_flutter url_launcher
          python3 /tmp/sp_bundle/setup_hybrid_arena.py
          flutter pub get

          mkdir -p build/web
          cp -f assets/www/index.html build/web/index.html
          flutter build apk --release

      - name: Downloadable Satta Pai Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Satta-Pai-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Downloadable Satta Pai Website Files
        uses: actions/upload-artifact@v4
        with:
          name: Satta-Pai-Website-Files
          path: build/web/
