name: Build Satta Pai Smooth App (V6 Native Google Picker + 120FPS Scroll)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build Native-Auth & 120FPS Smooth APK
        run: |
          set -e
          pip install -q pillow

          # 1. Backup index.html before cleaning workspace
          cp -f index.html /tmp/source_arena.html

          # 2. Clean old files
          rm -rf lib android ios web test build pubspec.yaml pubspec.lock .github/workflows/flutter_cloud_build.yml

          # 3. Create fresh Flutter project & add packages
          flutter create . --project-name satta_pai_arena --platforms=android
          rm -rf test/widget_test.dart
          flutter pub add webview_flutter url_launcher http

          # 4. Configure Encrypted Core, Logo Icons, Native Android Account Picker (MainActivity.kt) & 120FPS Engine
          python3 - << 'PYEOF'
          import os, re, io, glob, zlib, base64, shutil
          from PIL import Image, ImageDraw

          with open("/tmp/source_arena.html", "rb") as f:
              raw_html = f.read()

          # A. Encrypt index.html into binary assets/core.bin (Anti-MT-Manager Protection)
          os.makedirs("assets", exist_ok=True)
          key = [0x53, 0x41, 0x54, 0x54, 0x41, 0x5F, 0x50, 0x41, 0x49, 0x5F, 0x53, 0x45, 0x43, 0x55, 0x52, 0x45]
          comp = zlib.compress(raw_html, 9)
          enc = bytes([b ^ key[i % len(key)] for i, b in enumerate(comp)])
          with open("assets/core.bin", "wb") as f:
              f.write(enc)

          # B. Extract Satta Pai Logo from index.html for Android Launcher Icons
          html_str = raw_html.decode("utf-8", errors="ignore")
          m = re.search(r'window\.DEFAULT_SATTA_PAI_LOGO_DATA_URL\s*=\s*"data:image/[^;]+;base64,([^"]+)"', html_str)
          if m:
              shutil.rmtree("android/app/src/main/res/mipmap-anydpi-v26", ignore_errors=True)
              shutil.rmtree("android/app/src/main/res/mipmap-anydpi", ignore_errors=True)
              logo_im = Image.open(io.BytesIO(base64.b64decode(m.group(1)))).convert("RGBA")
              sizes = {
                  "mipmap-mdpi": 48,
                  "mipmap-hdpi": 72,
                  "mipmap-xhdpi": 96,
                  "mipmap-xxhdpi": 144,
                  "mipmap-xxxhdpi": 192,
              }
              for folder, px in sizes.items():
                  dst_dir = f"android/app/src/main/res/{folder}"
                  os.makedirs(dst_dir, exist_ok=True)
                  sq = logo_im.resize((px, px), Image.Resampling.LANCZOS)
                  sq.save(f"{dst_dir}/ic_launcher.png", format="PNG")
                  mask = Image.new("L", (px, px), 0)
                  ImageDraw.Draw(mask).ellipse((0, 0, px - 1, px - 1), fill=255)
                  rd = Image.new("RGBA", (px, px), (0, 0, 0, 0))
                  rd.paste(sq, (0, 0), mask=mask)
                  rd.save(f"{dst_dir}/ic_launcher_round.png", format="PNG")

          # C. Upgrade MainActivity.kt to open the Phone's Native Android Google Account Picker Dialog!
          kt_files = glob.glob("android/app/src/main/kotlin/**/MainActivity.kt", recursive=True)
          if kt_files:
              kt_path = kt_files[0]
              with open(kt_path, "r") as f:
                  pkg_line = f.readline().strip()
              kt_code = f"""{pkg_line}

          import android.accounts.AccountManager
          import android.app.Activity
          import android.content.Intent
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel

          class MainActivity : FlutterActivity() {{
              private val CHANNEL = "satta_pai/native_auth"
              private val REQ_PICK_GOOGLE = 9001
              private var pendingResult: MethodChannel.Result? = null

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {{
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, CHANNEL).setMethodCallHandler {{ call, result ->
                      if (call.method == "pickGoogleAccount") {{
                          try {{
                              pendingResult = result
                              val intent = AccountManager.newChooseAccountIntent(
                                  null,
                                  null,
                                  arrayOf("com.google"),
                                  false,
                                  null,
                                  null,
                                  null,
                                  null
                              )
                              startActivityForResult(intent, REQ_PICK_GOOGLE)
                          }} catch (e: Exception) {{
                              pendingResult = null
                              result.error("ERR", e.message, null)
                          }}
                      }} else {{
                          result.notImplemented()
                      }}
                  }}
              }}

              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {{
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == REQ_PICK_GOOGLE) {{
                      val res = pendingResult
                      pendingResult = null
                      if (resultCode == Activity.RESULT_OK && data != null) {{
                          val email = data.getStringExtra(AccountManager.KEY_ACCOUNT_NAME) ?: ""
                          res?.success(email)
                      }} else {{
                          res?.success("")
                      }}
                  }}
              }}
          }}
          """
              with open(kt_path, "w") as f:
                  f.write(kt_code)

          # D. Register encrypted assets/core.bin in pubspec.yaml
          with open("pubspec.yaml", "r") as f:
              pub = f.read()
          if "assets/core.bin" not in pub:
              pub = pub.replace("uses-material-design: true", "uses-material-design: true\n  assets:\n    - assets/core.bin")
          with open("pubspec.yaml", "w") as f:
              f.write(pub)

          # E. Write 120FPS Smooth Loopback + Native Phone Google Account Bridge in lib/main.dart
          main_dart = '''import 'dart:async';
          import 'dart:convert';
          import 'dart:io';
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';
          import 'package:webview_flutter/webview_flutter.dart';
          import 'package:url_launcher/url_launcher.dart';
          import 'package:http/http.dart' as http;

          void main() async {
            WidgetsFlutterBinding.ensureInitialized();
            SystemChrome.setSystemUIOverlayStyle(const SystemUiOverlayStyle(
              statusBarColor: Color(0xFF05070B),
              statusBarIconBrightness: Brightness.light,
              systemNavigationBarColor: Color(0xFF05070B),
              systemNavigationBarIconBrightness: Brightness.light,
            ));
            runApp(const MaterialApp(
              title: 'Satta Pai',
              debugShowCheckedModeBanner: false,
              home: SattaPaiSmoothShell(),
            ));
          }

          class SattaPaiSmoothShell extends StatefulWidget {
            const SattaPaiSmoothShell({super.key});
            @override
            State<SattaPaiSmoothShell> createState() => _SattaPaiSmoothShellState();
          }

          class _SattaPaiSmoothShellState extends State<SattaPaiSmoothShell> {
            static const MethodChannel _nativeAuthChannel = MethodChannel('satta_pai/native_auth');
            static const String _otaUpdateUrl = 'https://raw.githubusercontent.com/satta-pai/satta_pai_flutter/main/index.html';
            static const List<int> _k = [0x53, 0x41, 0x54, 0x54, 0x41, 0x5F, 0x50, 0x41, 0x49, 0x5F, 0x53, 0x45, 0x43, 0x55, 0x52, 0x45];

            WebViewController? _controller;
            HttpServer? _localServer;
            String _arenaHtml = '';
            bool _ready = false;

            @override
            void initState() {
              super.initState();
              _bootSmoothArena();
            }

            Future<String> _decryptBundledCore() async {
              final ByteData data = await rootBundle.load('assets/core.bin');
              final Uint8List enc = data.buffer.asUint8List();
              final Uint8List comp = Uint8List(enc.length);
              for (int i = 0; i < enc.length; i++) {
                comp[i] = enc[i] ^ _k[i % _k.length];
              }
              return utf8.decode(zlib.decode(comp), allowMalformed: true);
            }

            Future<void> _handleNativeGooglePicker() async {
              try {
                final String? selectedEmail = await _nativeAuthChannel.invokeMethod<String>('pickGoogleAccount');
                if (selectedEmail != null && selectedEmail.trim().isNotEmpty) {
                  final String clean = selectedEmail.trim().replaceAll("'", "");
                  await _controller?.runJavaScript("window.completeNativeAndroidGoogleLogin('\$clean', '');");
                }
              } catch (_) {}
            }

            Future<void> _bootSmoothArena() async {
              _arenaHtml = await _decryptBundledCore();

              // Live OTA Auto-Update from GitHub so old APK updates automatically
              try {
                final resp = await http.get(Uri.parse(_otaUpdateUrl)).timeout(const Duration(seconds: 2));
                if (resp.statusCode == 200 && resp.body.length > 50000 && resp.body.contains('sattapai-tournament')) {
                  _arenaHtml = resp.body;
                }
              } catch (_) {}

              // Serve over high-speed 127.0.0.1 loopback so Android touch scrolling runs at full 120FPS!
              try {
                _localServer = await HttpServer.bind(InternetAddress.loopbackIPv4, 8765, shared: true);
              } catch (_) {
                _localServer = await HttpServer.bind(InternetAddress.loopbackIPv4, 0, shared: true);
              }
              final int port = _localServer!.port;

              _localServer!.listen((HttpRequest request) async {
                request.response.headers.contentType = ContentType.html;
                request.response.headers.add('Access-Control-Allow-Origin', '*');
                request.response.write(_arenaHtml);
                await request.response.close();
              });

              final c = WebViewController()
                ..setJavaScriptMode(JavaScriptMode.unrestricted)
                ..setBackgroundColor(const Color(0xFF05070B))
                ..setUserAgent('Mozilla/5.0 (Linux; Android 14; Pixel 8) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Mobile Safari/537.36 SattaPaiApp/3.0')
                ..addJavaScriptChannel(
                  'SattaPaiNativeAuth',
                  onMessageReceived: (JavaScriptMessage message) {
                    if (message.message == 'pick_google_account') {
                      _handleNativeGooglePicker();
                    }
                  },
                )
                ..setNavigationDelegate(NavigationDelegate(
                  onNavigationRequest: (req) {
                    final u = req.url;
                    if (u.startsWith('intent://') ||
                        u.startsWith('freefire://') ||
                        u.startsWith('freefiremax://') ||
                        u.startsWith('upi://') ||
                        u.startsWith('whatsapp://') ||
                        u.startsWith('tg://') ||
                        u.startsWith('mailto:') ||
                        u.contains('whatsapp.com/channel/') ||
                        u.contains('t.me/') ||
                        u.contains('play.google.com/store')) {
                      _openExternalApp(u);
                      return NavigationDecision.prevent;
                    }
                    return NavigationDecision.navigate;
                  },
                ))
                ..loadRequest(Uri.parse('http://127.0.0.1:\$port/index.html'));

              if (mounted) setState(() { _controller = c; _ready = true; });
            }

            Future<void> _openExternalApp(String url) async {
              try {
                if (url.startsWith('intent://')) {
                  final m = RegExp(r'package=([a-zA-Z0-9._]+)').firstMatch(url);
                  if (m != null) {
                    final pkg = m.group(1)!;
                    await launchUrl(Uri.parse('market://details?id=\$pkg'), mode: LaunchMode.externalApplication);
                    return;
                  }
                }
                await launchUrl(Uri.parse(url), mode: LaunchMode.externalApplication);
              } catch (_) {}
            }

            @override
            void dispose() {
              _localServer?.close(force: true);
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              return WillPopScope(
                onWillPop: () async {
                  if (_controller != null && await _controller!.canGoBack()) {
                    await _controller!.goBack();
                    return false;
                  }
                  return true;
                },
                child: Scaffold(
                  backgroundColor: const Color(0xFF05070B),
                  body: SafeArea(
                    child: _ready && _controller != null
                        ? WebViewWidget(controller: _controller!)
                        : const Center(child: CircularProgressIndicator(color: Color(0xFF00FFFF))),
                  ),
                ),
              );
            }
          }
          '''
          with open("lib/main.dart", "w") as f:
              f.write(main_dart)

          # F. Patch AndroidManifest.xml with Hardware Acceleration, Internet & Free Fire Queries
          mf_path = "android/app/src/main/AndroidManifest.xml"
          with open(mf_path, "r") as f:
              mf = f.read()
          perms = '''
          <uses-permission android:name="android.permission.INTERNET"/>
          <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
          <uses-permission android:name="android.permission.VIBRATE"/>
          <queries>
              <package android:name="com.dts.freefiremax" />
              <package android:name="com.dts.freefireth" />
              <package android:name="com.garena.game.ffi" />
              <package android:name="com.whatsapp" />
              <package android:name="org.telegram.messenger" />
          </queries>
          '''
          if "android.permission.INTERNET" not in mf:
              mf = mf.replace("<application", perms + "\n    <application", 1)
          mf = re.sub(r'android:label="[^"]*"', 'android:label="Satta Pai"', mf)
          if "usesCleartextTraffic" not in mf:
              mf = mf.replace("<application", '<application\n        android:usesCleartextTraffic="true"\n        android:hardwareAccelerated="true"', 1)
          with open(mf_path, "w") as f:
              f.write(mf)
          PYEOF

          # 5. Build Obfuscated Release APK
          flutter pub get
          flutter build apk --release --obfuscate --split-debug-info=build/debug-info

      - name: Downloadable Satta Pai Official APK
        uses: actions/upload-artifact@v4
        with:
          name: Satta-Pai-Official-APK
          path: build/app/outputs/flutter-apk/app-release.apk
