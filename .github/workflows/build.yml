name: Auto Unzip & Build Satta Pai Hybrid App + Web

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  unzip_and_build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Base Flutter Platform & Overwrite With Satta Pai Arena
        run: |
          flutter create . --project-name satta_pai_arena
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          rm -rf test/widget_test.dart
          if [ -f "satta_pai_flutter_arena.zip" ]; then
            unzip -o satta_pai_flutter_arena.zip
          fi
          flutter pub get

      - name: Build Satta Pai Android APK & Web Bundle
        run: |
          mkdir -p build/web
          cp -f assets/www/index.html build/web/index.html
          flutter build apk --release

      - name: Downloadable Satta Pai Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Satta-Pai-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Downloadable Satta Pai Website Files
        uses: actions/upload-artifact@v4
        with:
          name: Satta-Pai-Website-Files
          path: build/web/
