name: Build Satta Pai APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'

      - name: Create Flutter Project & Configure Production Native App
        run: |
          mkdir -p /tmp/web_backup
          if [ -f "app.html" ]; then
            cp app.html /tmp/web_backup/index.html
          else
            cp index.html /tmp/web_backup/index.html
          fi

          flutter create --org com.sattapai --project-name satta_pai app_build
          cd app_build

          mkdir -p assets/www
          cp /tmp/web_backup/index.html assets/www/index.html

          flutter pub add webview_flutter webview_flutter_android url_launcher shared_preferences

          python3 - << 'PYEOF'
          with open("pubspec.yaml", "r") as f:
              content = f.read()

          if "assets/www/" not in content:
              asset_block = "\n  assets:\n    - assets/www/index.html\n"
              if "uses-material-design: true" in content:
                  content = content.replace("uses-material-design: true", "uses-material-design: true" + asset_block, 1)
              else:
                  content += "\nflutter:\n  uses-material-design: true" + asset_block

          with open("pubspec.yaml", "w") as f:
              f.write(content)
          PYEOF

          python3 - << 'PYEOF'
          import re, base64, os, shutil, json

          with open("assets/www/index.html", "r", encoding="utf-8") as f:
              html = f.read()

          res_dir = "android/app/src/main/res"
          for root, dirs, files in os.walk(res_dir):
              for file in files:
                  if file.startswith("ic_launcher"):
                      os.remove(os.path.join(root, file))

          m = re.search(r'id="custom-app-logo-img"\s+src="data:image/[^;]+;base64,([^"]+)"', html)
          default_bytes = base64.b64decode(m.group(1)) if m else b""

          vip_icons = {}
          vm = re.search(r'window\.VIP_CUSTOM_APP_ICONS\s*=\s*(\{.*?\});', html)
          if vm:
              try:
                  parsed = json.loads(vm.group(1))
                  for k, v in parsed.items():
                      durl = v.get("dataUrl", "")
                      if "base64," in durl:
                          vip_icons[k] = base64.b64decode(durl.split("base64,", 1)[1])
              except Exception:
                  pass

          for folder in ["mipmap-mdpi", "mipmap-hdpi", "mipmap-xhdpi", "mipmap-xxhdpi", "mipmap-xxxhdpi"]:
              target_dir = os.path.join(res_dir, folder)
              os.makedirs(target_dir, exist_ok=True)
              main_icon = vip_icons.get("icon_cyan") or default_bytes
              if main_icon:
                  with open(os.path.join(target_dir, "ic_launcher.webp"), "wb") as out:
                      out.write(main_icon)
                  with open(os.path.join(target_dir, "ic_launcher_round.webp"), "wb") as out:
                      out.write(main_icon)
              for key in ["icon_cyan", "icon_gold", "icon_purple", "icon_fire"]:
                  ibytes = vip_icons.get(key) or main_icon
                  if ibytes:
                      with open(os.path.join(target_dir, f"ic_{key}.webp"), "wb") as out:
                          out.write(ibytes)
          PYEOF

          python3 - << 'PYEOF'
          manifest_path = "android/app/src/main/AndroidManifest.xml"
          with open(manifest_path, "r") as f:
              manifest = f.read()

          perms = """
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.VIBRATE"/>
              <queries>
                  <package android:name="com.dts.freefiremax"/>
                  <package android:name="com.dts.freefireth"/>
                  <package android:name="com.garena.game.ffi"/>
              </queries>
          """
          if "android.permission.INTERNET" not in manifest:
              manifest = manifest.replace("<application", perms + "\n    <application", 1)

          if 'android:usesCleartextTraffic="true"' not in manifest:
              manifest = manifest.replace("<application", '<application\n        android:usesCleartextTraffic="true"\n        android:hardwareAccelerated="true"', 1)

          manifest = manifest.replace('android:label="satta_pai"', 'android:label="Satta Pai"')

          aliases = """
              <activity-alias
                  android:name=".IconGoldAlias"
                  android:enabled="false"
                  android:exported="true"
                  android:icon="@mipmap/ic_icon_gold"
                  android:label="Satta Pai"
                  android:targetActivity=".MainActivity">
                  <intent-filter>
                      <action android:name="android.intent.action.MAIN"/>
                      <category android:name="android.intent.category.LAUNCHER"/>
                  </intent-filter>
              </activity-alias>
              <activity-alias
                  android:name=".IconPurpleAlias"
                  android:enabled="false"
                  android:exported="true"
                  android:icon="@mipmap/ic_icon_purple"
                  android:label="Satta Pai"
                  android:targetActivity=".MainActivity">
                  <intent-filter>
                      <action android:name="android.intent.action.MAIN"/>
                      <category android:name="android.intent.category.LAUNCHER"/>
                  </intent-filter>
              </activity-alias>
              <activity-alias
                  android:name=".IconFireAlias"
                  android:enabled="false"
                  android:exported="true"
                  android:icon="@mipmap/ic_icon_fire"
                  android:label="Satta Pai"
                  android:targetActivity=".MainActivity">
                  <intent-filter>
                      <action android:name="android.intent.action.MAIN"/>
                      <category android:name="android.intent.category.LAUNCHER"/>
                  </intent-filter>
              </activity-alias>
          """
          if "IconGoldAlias" not in manifest:
              manifest = manifest.replace("</application>", aliases + "\n    </application>", 1)

          with open(manifest_path, "w") as f:
              f.write(manifest)
          PYEOF

          python3 - << 'PYEOF'
          import os, glob

          kt_files = glob.glob("android/app/src/main/kotlin/**/MainActivity.kt", recursive=True)
          kt_path = kt_files[0] if kt_files else "android/app/src/main/kotlin/com/sattapai/satta_pai/MainActivity.kt"
          os.makedirs(os.path.dirname(kt_path), exist_ok=True)

          kt_code = r'''package com.sattapai.satta_pai

          import android.accounts.AccountManager
          import android.app.Activity
          import android.content.ComponentName
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.view.WindowManager
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel

          class MainActivity: FlutterActivity() {
              private val CHANNEL = "satta_pai/native_auth"
              private var pendingResult: MethodChannel.Result? = null
              private val PICK_ACCOUNT_REQ = 9001

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  try {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
                          window.attributes.layoutInDisplayCutoutMode =
                              WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES
                      }
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                          val display = windowManager.defaultDisplay
                          val modes = display.supportedModes
                          var bestMode = display.mode
                          for (m in modes) {
                              if (m.refreshRate > bestMode.refreshRate) {
                                  bestMode = m
                              }
                          }
                          val params = window.attributes
                          params.preferredDisplayModeId = bestMode.modeId
                          window.attributes = params
                      }
                  } catch (e: Exception) {
                      // Ignore display mode errors
                  }
              }

              private fun switchLauncherIcon(iconKey: String) {
                  try {
                      val pm = applicationContext.packageManager
                      val pkg = applicationContext.packageName
                      val components = mapOf(
                          "icon_cyan" to ComponentName(pkg, "$pkg.MainActivity"),
                          "icon_gold" to ComponentName(pkg, "$pkg.IconGoldAlias"),
                          "icon_purple" to ComponentName(pkg, "$pkg.IconPurpleAlias"),
                          "icon_fire" to ComponentName(pkg, "$pkg.IconFireAlias")
                      )
                      for ((k, comp) in components) {
                          val state = if (k == iconKey)
                              PackageManager.COMPONENT_ENABLED_STATE_ENABLED
                          else
                              PackageManager.COMPONENT_ENABLED_STATE_DISABLED
                          pm.setComponentEnabledSetting(comp, state, PackageManager.DONT_KILL_APP)
                      }
                  } catch (e: Exception) {}
              }

              private fun launchInstalledFreeFire(targetPkg: String): Boolean {
                  try {
                      val pm = applicationContext.packageManager
                      val candidates = listOf(targetPkg, "com.dts.freefiremax", "com.dts.freefireth", "com.garena.game.ffi")
                      for (pkg in candidates) {
                          val launchIntent = pm.getLaunchIntentForPackage(pkg)
                          if (launchIntent != null) {
                              launchIntent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                              startActivity(launchIntent)
                              return true
                          }
                      }
                      val marketIntent = Intent(Intent.ACTION_VIEW, Uri.parse("market://details?id=" + targetPkg))
                      marketIntent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                      startActivity(marketIntent)
                      return true
                  } catch (e: Exception) {
                      return false
                  }
              }

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, CHANNEL).setMethodCallHandler { call, result ->
                      when (call.method) {
                          "pickAccount" -> {
                              if (pendingResult != null) {
                                  pendingResult?.success("")
                                  pendingResult = null
                              }
                              pendingResult = result
                              try {
                                  val intent = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                                      AccountManager.newChooseAccountIntent(
                                          null, null, arrayOf("com.google"), null, null, null, null
                                      )
                                  } else {
                                      @Suppress("DEPRECATION")
                                      AccountManager.newChooseAccountIntent(
                                          null, null, arrayOf("com.google"), false, null, null, null, null
                                      )
                                  }
                                  startActivityForResult(intent, PICK_ACCOUNT_REQ)
                              } catch (e: Exception) {
                                  pendingResult = null
                                  result.success("")
                              }
                          }
                          "launchFreeFire" -> {
                              val pkg = call.argument<String>("pkg") ?: "com.dts.freefiremax"
                              val ok = launchInstalledFreeFire(pkg)
                              result.success(ok)
                          }
                          "setAppIcon" -> {
                              val iconKey = call.argument<String>("icon") ?: "icon_cyan"
                              switchLauncherIcon(iconKey)
                              result.success(true)
                          }
                          else -> result.notImplemented()
                      }
                  }
              }

              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == PICK_ACCOUNT_REQ) {
                      val res = pendingResult
                      pendingResult = null
                      if (resultCode == Activity.RESULT_OK && data != null) {
                          val email = data.getStringExtra(AccountManager.KEY_ACCOUNT_NAME) ?: ""
                          res?.success(email)
                      } else {
                          res?.success("")
                      }
                  }
              }
          }
          '''
          with open(kt_path, "w") as f:
              f.write(kt_code)
          PYEOF

          python3 - << 'PYEOF'
          dart_code = r'''import 'dart:async';
          import 'dart:convert';
          import 'dart:io';
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';
          import 'package:shared_preferences/shared_preferences.dart';
          import 'package:webview_flutter/webview_flutter.dart';
          import 'package:webview_flutter_android/webview_flutter_android.dart';
          import 'package:url_launcher/url_launcher.dart';

          const String kCurrentNativeAppVersion = 'v13.0';
          const int kFixedLocalServerPort = 18765;

          void main() async {
            WidgetsFlutterBinding.ensureInitialized();
            SystemChrome.setSystemUIOverlayStyle(const SystemUiOverlayStyle(
              statusBarColor: Colors.transparent,
              statusBarIconBrightness: Brightness.light,
              systemNavigationBarColor: Color(0xFF0A0E17),
              systemNavigationBarIconBrightness: Brightness.light,
            ));
            runApp(const SattaPaiApp());
          }

          class SattaPaiApp extends StatelessWidget {
            const SattaPaiApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'Satta Pai',
                debugShowCheckedModeBanner: false,
                theme: ThemeData.dark().copyWith(
                  scaffoldBackgroundColor: const Color(0xFF0A0E17),
                ),
                home: const ArenaWebViewScreen(),
              );
            }
          }

          class ArenaWebViewScreen extends StatefulWidget {
            const ArenaWebViewScreen({super.key});

            @override
            State<ArenaWebViewScreen> createState() => _ArenaWebViewScreenState();
          }

          class _ArenaWebViewScreenState extends State<ArenaWebViewScreen> {
            WebViewController? _controller;
            HttpServer? _server;
            SharedPreferences? _prefs;
            bool _isReady = false;
            static const MethodChannel _authChannel = MethodChannel('satta_pai/native_auth');

            @override
            void initState() {
              super.initState();
              _startLocalServerAndWebView();
            }

            Future<void> _saveNativeAuthSession({
              required String email,
              String uid = '',
              String guest = '0',
              String appVersion = kCurrentNativeAppVersion,
            }) async {
              try {
                final prefs = _prefs ?? await SharedPreferences.getInstance();
                _prefs = prefs;
                await prefs.setString('sp_saved_email', email.trim().toLowerCase());
                if (uid.isNotEmpty) {
                  await prefs.setString('sp_saved_uid', uid.trim());
                }
                await prefs.setString('sp_saved_guest', guest);
                await prefs.setString('sp_saved_app_version', appVersion);
              } catch (e) {
                debugPrint('Error saving native auth prefs: ' + e.toString());
              }
            }

            Future<void> _clearNativeAuthSession() async {
              try {
                final prefs = _prefs ?? await SharedPreferences.getInstance();
                _prefs = prefs;
                await prefs.remove('sp_saved_email');
                await prefs.remove('sp_saved_uid');
                await prefs.remove('sp_saved_guest');
              } catch (e) {
                debugPrint('Error clearing native auth prefs: ' + e.toString());
              }
            }

            Future<void> _triggerNativePicker(String provider) async {
              try {
                final String? email = await _authChannel.invokeMethod<String>('pickAccount');
                if (email != null && email.trim().isNotEmpty && _controller != null) {
                  final String cleanEmail = email.trim().toLowerCase();
                  await _saveNativeAuthSession(
                    email: cleanEmail,
                    guest: '0',
                    appVersion: kCurrentNativeAppVersion,
                  );
                  final String safeEmail = jsonEncode(cleanEmail);
                  final String safeProv = jsonEncode(provider);
                  await _controller!.runJavaScript(
                    'if(window.onNativeAccountPicked){window.onNativeAccountPicked(' + safeEmail + ',' + safeProv + ');}'
                  );
                }
              } catch (e) {
                debugPrint('Native account picker error: ' + e.toString());
              }
            }

            String _buildHydratedHtml(String rawHtml) {
              String savedEmail = _prefs?.getString('sp_saved_email') ?? '';
              String savedUid = _prefs?.getString('sp_saved_uid') ?? '';
              String savedGuest = _prefs?.getString('sp_saved_guest') ?? '0';
              String savedVer = _prefs?.getString('sp_saved_app_version') ?? '';

              if (savedVer.isNotEmpty && savedVer != kCurrentNativeAppVersion) {
                savedEmail = '';
                savedUid = '';
                savedGuest = '0';
                _clearNativeAuthSession();
                _prefs?.setString('sp_saved_app_version', kCurrentNativeAppVersion);
              } else if (savedVer.isEmpty && (savedEmail.isNotEmpty || savedGuest == '1')) {
                savedVer = kCurrentNativeAppVersion;
                _prefs?.setString('sp_saved_app_version', kCurrentNativeAppVersion);
              }

              final Map<String, String> bootPayload = {
                'email': savedEmail,
                'uid': savedUid,
                'guest': savedGuest,
                'appVersion': savedVer.isEmpty ? kCurrentNativeAppVersion : savedVer,
                'nativeBuildVersion': kCurrentNativeAppVersion,
              };

              final String bootScript = '<script id="sp-native-boot-bridge">'
                  'window.__SP_NATIVE_STORAGE__ = ' + jsonEncode(bootPayload) + ';'
                  'try {'
                  '  var _spN = window.__SP_NATIVE_STORAGE__;'
                  '  if (_spN && _spN.email && _spN.email.indexOf("@") !== -1) {'
                  '    localStorage.setItem("satta_pai_auth_email", _spN.email);'
                  '    localStorage.setItem("satta_pai_native_google_email", _spN.email);'
                  '    localStorage.setItem("satta_pai_logged_app_version", _spN.appVersion || "' + kCurrentNativeAppVersion + '");'
                  '    sessionStorage.setItem("satta_pai_auth_email", _spN.email);'
                  '    if (_spN.uid) localStorage.setItem("satta_pai_auth_uid", _spN.uid);'
                  '    window.loggedEmail = _spN.email;'
                  '    window._hasVerifiedAuthSession = true;'
                  '  } else if (_spN && _spN.guest === "1") {'
                  '    localStorage.setItem("satta_pai_guest_session", "1");'
                  '    localStorage.setItem("satta_pai_logged_app_version", _spN.appVersion || "' + kCurrentNativeAppVersion + '");'
                  '    sessionStorage.setItem("satta_pai_guest_session", "1");'
                  '    window.loggedEmail = "guest";'
                  '  }'
                  '} catch(e) {}'
                  '</script>';

              if (rawHtml.contains('<head>')) {
                return rawHtml.replaceFirst('<head>', '<head>' + bootScript);
              }
              return bootScript + rawHtml;
            }

            Future<void> _startLocalServerAndWebView() async {
              try {
                _prefs = await SharedPreferences.getInstance();
                final indexHtml = await rootBundle.loadString('assets/www/index.html');

                try {
                  _server = await HttpServer.bind(
                    InternetAddress.loopbackIPv4,
                    kFixedLocalServerPort,
                    shared: true,
                  );
                } catch (_) {
                  _server = await HttpServer.bind(InternetAddress.loopbackIPv4, 0);
                }
                final int port = _server!.port;

                _server!.listen((HttpRequest req) async {
                  req.response.headers.set('Access-Control-Allow-Origin', '*');
                  req.response.headers.set('Cache-Control', 'no-store');
                  req.response.headers.contentType = ContentType.html;
                  req.response.write(_buildHydratedHtml(indexHtml));
                  await req.response.close();
                });

                final controller = WebViewController()
                  ..setJavaScriptMode(JavaScriptMode.unrestricted)
                  ..setBackgroundColor(const Color(0xFF0A0E17))
                  ..setUserAgent('Mozilla/5.0 (Linux; Android 14; Pixel 8 Pro) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Mobile Safari/537.36 SattaPaiApp/13.0')
                  ..addJavaScriptChannel(
                    'SattaPaiNativeAuth',
                    onMessageReceived: (JavaScriptMessage message) async {
                      final msg = message.message;
                      if (msg.startsWith('pick_account:')) {
                        final provider = msg.substring('pick_account:'.length);
                        await _triggerNativePicker(provider.isEmpty ? 'Google' : provider);
                      } else if (msg.startsWith('save_auth:')) {
                        try {
                          final payloadStr = msg.substring('save_auth:'.length);
                          final Map<String, dynamic> data = jsonDecode(payloadStr);
                          await _saveNativeAuthSession(
                            email: (data['email'] ?? '').toString(),
                            uid: (data['uid'] ?? '').toString(),
                            guest: (data['guest'] ?? '0').toString(),
                            appVersion: (data['appVersion'] ?? kCurrentNativeAppVersion).toString(),
                          );
                        } catch (e) {
                          debugPrint('save_auth parse error: ' + e.toString());
                        }
                      } else if (msg == 'clear_auth') {
                        await _clearNativeAuthSession();
                      } else if (msg.startsWith('launch_pkg:')) {
                        final pkg = msg.substring('launch_pkg:'.length).trim();
                        await _authChannel.invokeMethod('launchFreeFire', {'pkg': pkg});
                      } else if (msg.startsWith('set_app_icon:')) {
                        final iconKey = msg.substring('set_app_icon:'.length).trim();
                        await _authChannel.invokeMethod('setAppIcon', {'icon': iconKey});
                      } else {
                        await _triggerNativePicker('Google');
                      }
                    },
                  )
                  ..setNavigationDelegate(
                    NavigationDelegate(
                      onNavigationRequest: (NavigationRequest request) {
                        final url = request.url;
                        if (url.startsWith('upi://') ||
                            url.startsWith('whatsapp://') ||
                            url.startsWith('intent://') ||
                            url.startsWith('freefire://') ||
                            url.startsWith('freefiremax://') ||
                            url.startsWith('market://') ||
                            url.startsWith('mailto:') ||
                            url.startsWith('tel:')) {
                          launchUrl(Uri.parse(url), mode: LaunchMode.externalApplication);
                          return NavigationDecision.prevent;
                        }
                        return NavigationDecision.navigate;
                      },
                    ),
                  );

                if (controller.platform is AndroidWebViewController) {
                  AndroidWebViewController.enableDebugging(false);
                  (controller.platform as AndroidWebViewController)
                      .setMediaPlaybackRequiresUserGesture(false);
                }

                final String localUrl = 'http://127.0.0.1:' + port.toString() + '/index.html';
                await controller.loadRequest(Uri.parse(localUrl));

                if (mounted) {
                  setState(() {
                    _controller = controller;
                    _isReady = true;
                  });
                }
              } catch (e) {
                debugPrint('Error starting WebView: ' + e.toString());
              }
            }

            @override
            void dispose() {
              _server?.close(force: true);
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              return PopScope(
                canPop: false,
                onPopInvoked: (bool didPop) async {
                  if (didPop) return;
                  if (_controller != null && await _controller!.canGoBack()) {
                    await _controller!.goBack();
                  }
                },
                child: Scaffold(
                  backgroundColor: const Color(0xFF0A0E17),
                  body: SafeArea(
                    child: _isReady && _controller != null
                        ? WebViewWidget(controller: _controller!)
                        : const Center(
                            child: CircularProgressIndicator(color: Color(0xFF00F2FE)),
                          ),
                  ),
                ),
              );
            }
          }
          '''
          with open("lib/main.dart", "w") as f:
              f.write(dart_code)
          PYEOF

          flutter build apk --release

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Satta-Pai-Release-APK
          path: app_build/build/app/outputs/flutter-apk/app-release.apk
