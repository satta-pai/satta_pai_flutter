name: Build Satta Pai APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  # 📌 HOW TO UPDATE APK VERSION (e.g. 1.0.0 -> 1.0.1):
  # Simply change APP_VERSION_NAME to "1.0.1" and increment APP_VERSION_CODE to "101"!
  APP_VERSION_NAME: "18.0.0"
  APP_VERSION_CODE: "1800"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'

      - name: Create Flutter Project & Configure Production Native App
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          mkdir -p /tmp/web_backup
          if [ -f "app.html" ]; then
            cp app.html /tmp/web_backup/index.html
          else
            cp index.html /tmp/web_backup/index.html
          fi

          flutter create --org com.sattapai --project-name satta_pai app_build
          cd app_build

          mkdir -p assets/www
          cp /tmp/web_backup/index.html assets/www/index.html

          flutter pub add webview_flutter webview_flutter_android url_launcher shared_preferences

          python3 - << 'PYEOF'
          with open("pubspec.yaml", "r") as f:
              content = f.read()

          if "assets/www/" not in content:
              asset_block = "\n  assets:\n    - assets/www/index.html\n"
              if "uses-material-design: true" in content:
                  content = content.replace("uses-material-design: true", "uses-material-design: true" + asset_block, 1)
              else:
                  content += "\nflutter:\n  uses-material-design: true" + asset_block

          with open("pubspec.yaml", "w") as f:
              f.write(content)
          PYEOF

          python3 - << 'PYEOF'
          import re, base64, os, shutil, json

          with open("assets/www/index.html", "r", encoding="utf-8") as f:
              html = f.read()

          res_dir = "android/app/src/main/res"
          for root, dirs, files in os.walk(res_dir):
              for file in files:
                  if file.startswith("ic_launcher"):
                      os.remove(os.path.join(root, file))

          m = re.search(r'id="custom-app-logo-img"\s+src="data:image/[^;]+;base64,([^"]+)"', html)
          default_bytes = base64.b64decode(m.group(1)) if m else b""

          vip_icons = {}
          vm = re.search(r'window\.VIP_CUSTOM_APP_ICONS\s*=\s*(\{.*?\});', html)
          if vm:
              try:
                  parsed = json.loads(vm.group(1))
                  for k, v in parsed.items():
                      durl = v.get("dataUrl", "")
                      if "base64," in durl:
                          vip_icons[k] = base64.b64decode(durl.split("base64,", 1)[1])
              except Exception:
                  pass

          for folder in ["mipmap-mdpi", "mipmap-hdpi", "mipmap-xhdpi", "mipmap-xxhdpi", "mipmap-xxxhdpi"]:
              target_dir = os.path.join(res_dir, folder)
              os.makedirs(target_dir, exist_ok=True)
              main_icon = vip_icons.get("icon_cyan") or default_bytes
              if main_icon:
                  with open(os.path.join(target_dir, "ic_launcher.webp"), "wb") as out:
                      out.write(main_icon)
                  with open(os.path.join(target_dir, "ic_launcher_round.webp"), "wb") as out:
                      out.write(main_icon)
              for key in ["icon_cyan", "icon_gold", "icon_purple", "icon_fire"]:
                  ibytes = vip_icons.get(key) or main_icon
                  if ibytes:
                      with open(os.path.join(target_dir, f"ic_{key}.webp"), "wb") as out:
                          out.write(ibytes)
          PYEOF

          python3 - << 'PYEOF'
          manifest_path = "android/app/src/main/AndroidManifest.xml"
          with open(manifest_path, "r") as f:
              manifest = f.read()

          perms = """
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.VIBRATE"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <uses-permission android:name="android.permission.CAMERA"/>
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/>
              <uses-permission android:name="android.permission.USE_FULL_SCREEN_INTENT"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK"/>
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS"/>
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>
              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO"/>
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28"/>
              <queries>
                  <package android:name="com.dts.freefiremax"/>
                  <package android:name="com.dts.freefireth"/>
                  <package android:name="com.garena.game.ffi"/>
              </queries>
          """
          if "android.permission.INTERNET" not in manifest:
              manifest = manifest.replace("<application", perms + "\n    <application", 1)

          if 'android:usesCleartextTraffic="true"' not in manifest:
              manifest = manifest.replace("<application", '<application\n        android:usesCleartextTraffic="true"\n        android:hardwareAccelerated="true"\n        android:allowBackup="true"\n        android:fullBackupContent="true"', 1)

          manifest = manifest.replace('android:label="satta_pai"', 'android:label="Satta Pai"')

          aliases = """
              <activity-alias
                  android:name=".IconGoldAlias"
                  android:enabled="false"
                  android:exported="true"
                  android:icon="@mipmap/ic_icon_gold"
                  android:label="Satta Pai"
                  android:targetActivity=".MainActivity">
                  <intent-filter>
                      <action android:name="android.intent.action.MAIN"/>
                      <category android:name="android.intent.category.LAUNCHER"/>
                  </intent-filter>
              </activity-alias>
              <activity-alias
                  android:name=".IconPurpleAlias"
                  android:enabled="false"
                  android:exported="true"
                  android:icon="@mipmap/ic_icon_purple"
                  android:label="Satta Pai"
                  android:targetActivity=".MainActivity">
                  <intent-filter>
                      <action android:name="android.intent.action.MAIN"/>
                      <category android:name="android.intent.category.LAUNCHER"/>
                  </intent-filter>
              </activity-alias>
              <activity-alias
                  android:name=".IconFireAlias"
                  android:enabled="false"
                  android:exported="true"
                  android:icon="@mipmap/ic_icon_fire"
                  android:label="Satta Pai"
                  android:targetActivity=".MainActivity">
                  <intent-filter>
                      <action android:name="android.intent.action.MAIN"/>
                      <category android:name="android.intent.category.LAUNCHER"/>
                  </intent-filter>
              </activity-alias>
          """
          service_decl = """
              <service
                  android:name=".SattaPaiKeepAliveService"
                  android:enabled="true"
                  android:exported="false"
                  android:stopWithTask="false"
                  android:foregroundServiceType="microphone|mediaPlayback" />
          """
          if "SattaPaiKeepAliveService" not in manifest:
              manifest = manifest.replace("</application>", service_decl + "\n" + aliases + "\n    </application>", 1)

          with open(manifest_path, "w") as f:
              f.write(manifest)
          PYEOF

          python3 - << 'PYEOF'
          import os, glob

          kt_files = glob.glob("android/app/src/main/kotlin/**/MainActivity.kt", recursive=True)
          kt_path = kt_files[0] if kt_files else "android/app/src/main/kotlin/com/sattapai/satta_pai/MainActivity.kt"
          os.makedirs(os.path.dirname(kt_path), exist_ok=True)

          kt_code = r'''package com.sattapai.satta_pai

          import android.Manifest
          import android.accounts.AccountManager
          import android.app.Activity
          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.ComponentName
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.content.pm.ServiceInfo
          import android.graphics.Bitmap
          import android.graphics.BitmapFactory
          import android.graphics.Color
          import android.media.AudioAttributes
          import android.media.AudioManager
          import android.media.RingtoneManager
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.IBinder
          import android.os.PowerManager
          import android.provider.OpenableColumns
          import android.util.Base64
          import android.view.KeyEvent
          import android.view.WindowManager
          import android.webkit.WebView
          import android.widget.Toast
          import androidx.core.app.ActivityCompat
          import androidx.core.app.NotificationCompat
          import androidx.core.content.ContextCompat
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          import org.json.JSONObject
          import java.io.ByteArrayOutputStream
          import java.io.File
          import java.io.FileOutputStream

          class SattaPaiKeepAliveService : Service() {
              private var wakeLock: PowerManager.WakeLock? = null

              override fun onCreate() {
                  super.onCreate()
                  try {
                      val pm = getSystemService(Context.POWER_SERVICE) as PowerManager
                      wakeLock = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "SattaPai::VoiceCallWakeLock")
                      wakeLock?.setReferenceCounted(false)
                  } catch (e: Exception) {}
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  val mode = intent?.getStringExtra("mode") ?: "standby"
                  val partner = intent?.getStringExtra("partner") ?: "Arena Player"
                  try {
                      val nm = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                      val chanId = "satta_pai_voice_service"
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          val chan = NotificationChannel(chanId, "Satta Pai Active Voice Call", NotificationManager.IMPORTANCE_LOW)
                          chan.description = "Keeps Satta Pai Voice Call & Mic active in background"
                          nm.createNotificationChannel(chan)
                      }
                      val openIntent = Intent(this, MainActivity::class.java).apply {
                          this.flags = Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_SINGLE_TOP
                      }
                      val piFlags = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                          PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                      } else {
                          PendingIntent.FLAG_UPDATE_CURRENT
                      }
                      val pi = PendingIntent.getActivity(this, 8801, openIntent, piFlags)
                      val titleTxt = if (mode == "call") "📞 Active Voice Call • $partner" else "🛡️ Satta Pai Arena Connected"
                      val bodyTxt = if (mode == "call") "Tap to return to ongoing voice call (Mic Active)" else "Listening for incoming Arena Voice Calls"
                      val notif = NotificationCompat.Builder(this, chanId)
                          .setSmallIcon(applicationInfo.icon)
                          .setContentTitle(titleTxt)
                          .setContentText(bodyTxt)
                          .setOngoing(mode == "call")
                          .setContentIntent(pi)
                          .build()

                      if (mode == "call") {
                          wakeLock?.acquire(60 * 60 * 1000L)
                          val am = getSystemService(Context.AUDIO_SERVICE) as AudioManager
                          am.mode = AudioManager.MODE_IN_COMMUNICATION
                          am.isSpeakerphoneOn = true
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                              startForeground(8801, notif, ServiceInfo.FOREGROUND_SERVICE_TYPE_MICROPHONE or ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PLAYBACK)
                          } else {
                              startForeground(8801, notif)
                          }
                      } else {
                          if (wakeLock?.isHeld == true) wakeLock?.release()
                          val am = getSystemService(Context.AUDIO_SERVICE) as AudioManager
                          am.mode = AudioManager.MODE_NORMAL
                          stopForeground(true)
                      }
                  } catch (e: Exception) {}
                  return START_STICKY
              }

              override fun onTaskRemoved(rootIntent: Intent?) {
                  // Keep call service alive even if app is swiped from recents during a call
                  super.onTaskRemoved(rootIntent)
              }

              override fun onBind(intent: Intent?): IBinder? = null
          }

          class MainActivity: FlutterActivity() {
              private val CHANNEL = "satta_pai/native_auth"
              private val NOTIF_CHANNEL_ID = "satta_pai_esports_alerts"
              private val CALL_CHANNEL_ID = "satta_pai_heads_up_calls_v2"
              private var pendingResult: MethodChannel.Result? = null
              private var pendingFileResult: MethodChannel.Result? = null
              private val PICK_ACCOUNT_REQ = 9001
              private val REQ_POST_NOTIF = 9002
              private val PICK_FILE_REQ = 9003
              private val REQ_RECORD_AUDIO = 9004
              private var isVipDmSecureShieldActive = false
              private var pendingOpenDmEmail: String = ""

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  try {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O_MR1) {
                          setShowWhenLocked(true)
                          setTurnScreenOn(true)
                      } else {
                          @Suppress("DEPRECATION")
                          window.addFlags(
                              WindowManager.LayoutParams.FLAG_SHOW_WHEN_LOCKED or
                              WindowManager.LayoutParams.FLAG_TURN_SCREEN_ON
                          )
                      }
                  } catch (e: Exception) {}
                  intent?.getStringExtra("open_dm_email")?.let {
                      if (it.isNotEmpty()) pendingOpenDmEmail = it
                  }
                  createNotificationChannelIfNeeded()
                  requestNotificationPermissionIfNeeded()
              }

              override fun onNewIntent(intent: Intent) {
                  super.onNewIntent(intent)
                  setIntent(intent)
                  intent.getStringExtra("open_dm_email")?.let {
                      if (it.isNotEmpty()) pendingOpenDmEmail = it
                  }
              }

              private fun setCallForegroundState(active: Boolean, partnerName: String = "Player") {
                  try {
                      val sIntent = Intent(this, SattaPaiKeepAliveService::class.java).apply {
                          putExtra("mode", if (active) "call" else "standby")
                          putExtra("partner", partnerName)
                      }
                      if (active && Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          startForegroundService(sIntent)
                      } else {
                          startService(sIntent)
                      }
                  } catch (e: Exception) {}
              }

              private fun requestNotificationPermissionIfNeeded() {
                  try {
                      if (Build.VERSION.SDK_INT >= 33) {
                          if (ContextCompat.checkSelfPermission(this, Manifest.permission.POST_NOTIFICATIONS)
                              != PackageManager.PERMISSION_GRANTED) {
                              ActivityCompat.requestPermissions(
                                  this,
                                  arrayOf(Manifest.permission.POST_NOTIFICATIONS),
                                  REQ_POST_NOTIF
                              )
                          }
                      }
                  } catch (e: Exception) {}
              }

              private fun ensureMicrophonePermission(): Boolean {
                  return try {
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO)
                          != PackageManager.PERMISSION_GRANTED) {
                          ActivityCompat.requestPermissions(
                              this,
                              arrayOf(Manifest.permission.RECORD_AUDIO),
                              REQ_RECORD_AUDIO
                          )
                          false
                      } else {
                          true
                      }
                  } catch (e: Exception) {
                      false
                  }
              }

              private fun createNotificationChannelIfNeeded() {
                  try {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          val nm = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                          val chan = NotificationChannel(
                              NOTIF_CHANNEL_ID,
                              "Satta Pai Arena Alerts & DMs",
                              NotificationManager.IMPORTANCE_HIGH
                          )
                          chan.description = "Private DM messages, Match Room Keys & App Update alerts"
                          chan.enableVibration(true)
                          nm.createNotificationChannel(chan)

                          val ringUri = RingtoneManager.getDefaultUri(RingtoneManager.TYPE_RINGTONE)
                          val audioAttr = AudioAttributes.Builder()
                              .setUsage(AudioAttributes.USAGE_NOTIFICATION_RINGTONE)
                              .setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION)
                              .build()
                          val callChan = NotificationChannel(
                              CALL_CHANNEL_ID,
                              "Satta Pai Incoming Voice Calls",
                              NotificationManager.IMPORTANCE_HIGH
                          )
                          callChan.description = "WhatsApp-style Heads-Up Incoming Voice Call Banner over games & apps"
                          callChan.enableVibration(true)
                          callChan.vibrationPattern = longArrayOf(0, 800, 400, 800, 400, 800, 400, 800)
                          callChan.setSound(ringUri, audioAttr)
                          callChan.lockscreenVisibility = Notification.VISIBILITY_PUBLIC
                          nm.createNotificationChannel(callChan)
                      }
                  } catch (e: Exception) {}
              }

              private fun showNativeNotification(title: String, body: String, notifId: Int, dmEmail: String = "") {
                  try {
                      createNotificationChannelIfNeeded()
                      val nm = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                      val isCallAlert = title.contains("Call", ignoreCase = true) || dmEmail.startsWith("call:")
                      val intent = Intent(this, MainActivity::class.java).apply {
                          flags = Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_SINGLE_TOP or Intent.FLAG_ACTIVITY_CLEAR_TOP
                          if (dmEmail.isNotEmpty()) {
                              putExtra("open_dm_email", dmEmail)
                          }
                      }
                      val piFlags = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                          PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                      } else {
                          PendingIntent.FLAG_UPDATE_CURRENT
                      }
                      val pendingIntent = PendingIntent.getActivity(this, if (isCallAlert) 9991 else notifId, intent, piFlags)
                      val channelToUse = if (isCallAlert) CALL_CHANNEL_ID else NOTIF_CHANNEL_ID
                      val builder = NotificationCompat.Builder(this, channelToUse)
                          .setSmallIcon(applicationInfo.icon)
                          .setContentTitle(title)
                          .setContentText(body)
                          .setStyle(NotificationCompat.BigTextStyle().bigText(body))
                          .setPriority(NotificationCompat.PRIORITY_MAX)
                          .setCategory(if (isCallAlert) NotificationCompat.CATEGORY_CALL else NotificationCompat.CATEGORY_MESSAGE)
                          .setVisibility(NotificationCompat.VISIBILITY_PUBLIC)
                          .setDefaults(NotificationCompat.DEFAULT_ALL)
                          .setAutoCancel(true)
                          .setContentIntent(pendingIntent)

                      if (isCallAlert) {
                          builder.setFullScreenIntent(pendingIntent, true)
                          builder.setColor(Color.parseColor("#10B981"))
                          builder.setColorized(true)
                          builder.setVibrate(longArrayOf(0, 800, 400, 800, 400, 800, 400, 800))
                          builder.addAction(android.R.drawable.sym_action_call, "📞 Answer Call", pendingIntent)
                      }
                      nm.notify(if (isCallAlert) 9991 else notifId, builder.build())
                  } catch (e: Exception) {}
              }

              private fun switchLauncherIcon(iconKey: String) {
                  try {
                      val pm = applicationContext.packageManager
                      val pkg = applicationContext.packageName
                      val components = mapOf(
                          "icon_cyan" to ComponentName(pkg, "$pkg.MainActivity"),
                          "icon_gold" to ComponentName(pkg, "$pkg.IconGoldAlias"),
                          "icon_purple" to ComponentName(pkg, "$pkg.IconPurpleAlias"),
                          "icon_fire" to ComponentName(pkg, "$pkg.IconFireAlias")
                      )
                      for ((k, comp) in components) {
                          val state = if (k == iconKey)
                              PackageManager.COMPONENT_ENABLED_STATE_ENABLED
                          else
                              PackageManager.COMPONENT_ENABLED_STATE_DISABLED
                          pm.setComponentEnabledSetting(comp, state, PackageManager.DONT_KILL_APP)
                      }
                  } catch (e: Exception) {}
              }

              private fun saveAndMaybeShareImage(name: String, b64: String, share: Boolean): Boolean {
                  return try {
                      val bytes = Base64.decode(b64, Base64.DEFAULT)
                      if (bytes.isEmpty()) return false
                      val safeName = name.replace(Regex("[^a-zA-Z0-9._-]"), "_").ifEmpty { "SattaPai_poster.jpg" }
                      var uri: Uri? = null
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                          val values = android.content.ContentValues()
                          values.put(android.provider.MediaStore.Images.Media.DISPLAY_NAME, safeName)
                          values.put(android.provider.MediaStore.Images.Media.MIME_TYPE, "image/jpeg")
                          values.put(android.provider.MediaStore.Images.Media.RELATIVE_PATH, "Pictures/SattaPai")
                          uri = contentResolver.insert(android.provider.MediaStore.Images.Media.EXTERNAL_CONTENT_URI, values)
                          if (uri != null) {
                              contentResolver.openOutputStream(uri)?.use { it.write(bytes) }
                          }
                      } else {
                          if (ContextCompat.checkSelfPermission(this, Manifest.permission.WRITE_EXTERNAL_STORAGE) != PackageManager.PERMISSION_GRANTED) {
                              ActivityCompat.requestPermissions(this, arrayOf(Manifest.permission.WRITE_EXTERNAL_STORAGE), 9005)
                              Toast.makeText(this, "Allow storage permission, then tap again.", Toast.LENGTH_LONG).show()
                              return false
                          }
                          val bmp = BitmapFactory.decodeByteArray(bytes, 0, bytes.size)
                          val path = android.provider.MediaStore.Images.Media.insertImage(contentResolver, bmp, safeName, "Satta Pai Esports")
                          if (path != null) uri = Uri.parse(path)
                      }
                      if (uri == null) return false
                      if (share) {
                          val send = Intent(Intent.ACTION_SEND)
                          send.type = "image/jpeg"
                          send.putExtra(Intent.EXTRA_STREAM, uri)
                          send.putExtra(Intent.EXTRA_TEXT, "Satta Pai Esports")
                          send.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                          startActivity(Intent.createChooser(send, "Share poster"))
                      } else {
                          Toast.makeText(this, "Saved to Pictures/SattaPai", Toast.LENGTH_SHORT).show()
                      }
                      true
                  } catch (e: Exception) {
                      false
                  }
              }
              private fun launchInstalledFreeFire(targetPkg: String): Boolean {
                  try {
                      val pm = applicationContext.packageManager
                      val candidates = listOf(targetPkg, "com.dts.freefiremax", "com.dts.freefireth", "com.garena.game.ffi")
                      for (pkg in candidates) {
                          val launchIntent = pm.getLaunchIntentForPackage(pkg)
                          if (launchIntent != null) {
                              launchIntent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                              startActivity(launchIntent)
                              return true
                          }
                      }
                      val marketIntent = Intent(Intent.ACTION_VIEW, Uri.parse("market://details?id=" + targetPkg))
                      marketIntent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                      startActivity(marketIntent)
                      return true
                  } catch (e: Exception) {
                      return false
                  }
              }

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, CHANNEL).setMethodCallHandler { call, result ->
                      when (call.method) {
                          "pickAccount" -> {
                              if (pendingResult != null) {
                                  pendingResult?.success("")
                                  pendingResult = null
                              }
                              pendingResult = result
                              try {
                                  val intent = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                                      AccountManager.newChooseAccountIntent(
                                          null, null, arrayOf("com.google"), null, null, null, null
                                      )
                                  } else {
                                      @Suppress("DEPRECATION")
                                      AccountManager.newChooseAccountIntent(
                                          null, null, arrayOf("com.google"), false, null, null, null, null
                                      )
                                  }
                                  startActivityForResult(intent, PICK_ACCOUNT_REQ)
                              } catch (e: Exception) {
                                  pendingResult = null
                                  result.success("")
                              }
                          }
                          "pickFile" -> {
                              if (pendingFileResult != null) {
                                  pendingFileResult?.success("")
                                  pendingFileResult = null
                              }
                              pendingFileResult = result
                              try {
                                  val mime = call.argument<String>("mime") ?: "*/*"
                                  val cleanMime = when {
                                      mime.contains("audio") -> "audio/*"
                                      mime.contains("image") -> "image/*"
                                      else -> "*/*"
                                  }
                                  val intent = Intent(Intent.ACTION_GET_CONTENT).apply {
                                      type = cleanMime
                                      addCategory(Intent.CATEGORY_OPENABLE)
                                  }
                                  startActivityForResult(Intent.createChooser(intent, "Select File"), PICK_FILE_REQ)
                              } catch (e: Exception) {
                                  pendingFileResult = null
                                  result.success("")
                              }
                          }
                          "requestMicPermission" -> {
