          python3 - << 'PYEOF'
          import os, re, json, glob

          PKG = "com.sattapai.satta_pai"
          kt_main = glob.glob("android/app/src/main/kotlin/**/MainActivity.kt", recursive=True)
          kt_dir = os.path.dirname(kt_main[0])
          enabled = False
          gs = os.environ.get("GOOGLE_SERVICES_JSON", "").strip()

          if not gs:
              print("::warning::GOOGLE_SERVICES_JSON secret not set - building WITHOUT push notifications (FCM disabled).")
          else:
              try:
                  parsed = json.loads(gs)
                  pkgs = [c.get("client_info", {}).get("android_client_info", {}).get("package_name") for c in parsed.get("client", [])]
                  if PKG not in pkgs:
                      print("::warning::google-services.json has no Android app for " + PKG + " (found: " + ", ".join(map(str, pkgs)) + "). FCM disabled.")
                  else:
                      with open("android/settings.gradle") as f: settings = f.read()
                      with open("android/app/build.gradle") as f: appg = f.read()
                      m = re.search(r'^(\s*)id "com\.android\.application" version "[^"]+" apply false\s*$', settings, re.M)
                      p = re.search(r'^(\s*)id "dev\.flutter\.flutter-gradle-plugin"\s*$', appg, re.M)
                      if not m or not p:
                          print("::warning::Unexpected Gradle template layout - FCM disabled (build continues).")
                      else:
                          if "com.google.gms.google-services" not in settings:
                              settings = settings[:m.end()] + "\n" + m.group(1) + 'id "com.google.gms.google-services" version "4.4.2" apply false' + settings[m.end():]
                          if "com.google.gms.google-services" not in appg:
                              appg = appg[:p.end()] + "\n" + p.group(1) + 'id "com.google.gms.google-services"' + appg[p.end():]
                          if "firebase-messaging" not in appg:
                              appg += "\ndependencies {\n    implementation platform('com.google.firebase:firebase-bom:33.4.0')\n    implementation 'com.google.firebase:firebase-messaging'\n}\n"
                          with open("android/settings.gradle", "w") as f: f.write(settings)
                          with open("android/app/build.gradle", "w") as f: f.write(appg)
                          with open("android/app/google-services.json", "w") as f: f.write(gs)
                          enabled = True
              except Exception as ex:
                  print("::warning::GOOGLE_SERVICES_JSON invalid: " + str(ex) + " - FCM disabled.")

          NOTIFIER = r"""package com.sattapai.satta_pai

          import android.app.ActivityManager
          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.content.Context
          import android.content.Intent
          import android.graphics.Color
          import android.media.AudioAttributes
          import android.media.RingtoneManager
          import android.os.Build
          import androidx.core.app.NotificationCompat

          object SattaPaiNotifier {
              private const val CH_ALERTS = "satta_pai_esports_alerts"
              private const val CH_CALL = "satta_pai_heads_up_calls_v2"
              private const val CH_SIREN = "satta_pai_match_siren_v1"

              private fun isForeground(ctx: Context): Boolean {
                  return try {
                      val am = ctx.getSystemService(Context.ACTIVITY_SERVICE) as ActivityManager
                      val procs = am.runningAppProcesses ?: return false
                      procs.any { it.processName == ctx.packageName && it.importance == ActivityManager.RunningAppProcessInfo.IMPORTANCE_FOREGROUND }
                  } catch (e: Exception) { false }
              }

              private fun ensureChannels(ctx: Context) {
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.O) return
                  val nm = ctx.getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                  val alerts = NotificationChannel(CH_ALERTS, "Satta Pai Arena Alerts & DMs", NotificationManager.IMPORTANCE_HIGH)
                  alerts.enableVibration(true)
                  nm.createNotificationChannel(alerts)

                  val callAttr = AudioAttributes.Builder().setUsage(AudioAttributes.USAGE_NOTIFICATION_RINGTONE).setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION).build()
                  val call = NotificationChannel(CH_CALL, "Satta Pai Incoming Voice Calls", NotificationManager.IMPORTANCE_HIGH)
                  call.enableVibration(true)
                  call.vibrationPattern = longArrayOf(0, 800, 400, 800, 400, 800, 400, 800)
                  call.setSound(RingtoneManager.getDefaultUri(RingtoneManager.TYPE_RINGTONE), callAttr)
                  call.lockscreenVisibility = Notification.VISIBILITY_PUBLIC
                  nm.createNotificationChannel(call)

                  val sirenAttr = AudioAttributes.Builder().setUsage(AudioAttributes.USAGE_ALARM).setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION).build()
                  val siren = NotificationChannel(CH_SIREN, "Match Room ID Siren", NotificationManager.IMPORTANCE_HIGH)
                  siren.description = "Siren when a Room ID is published and 10 minutes before your match"
                  siren.enableVibration(true)
                  siren.vibrationPattern = longArrayOf(0, 600, 250, 600, 250, 600, 250, 600)
                  siren.setSound(RingtoneManager.getDefaultUri(RingtoneManager.TYPE_ALARM), sirenAttr)
                  siren.lockscreenVisibility = Notification.VISIBILITY_PUBLIC
                  nm.createNotificationChannel(siren)
              }

              fun show(ctx: Context, type: String, title: String, body: String, dmEmail: String, matchId: String) {
                  try {
                      // App on screen: the web layer already shows its own in-app alert / ringing UI.
                      if (isForeground(ctx)) return
                      ensureChannels(ctx)
                      val nm = ctx.getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                      val isCall = type == "call"
                      val isSiren = type == "room_siren" || type == "match_start"
                      val id = when {
                          isCall -> 9991
                          isSiren -> 7000 + (matchId.hashCode() and 0xFFFF)
                          else -> 20000 + ((if (dmEmail.isNotEmpty()) dmEmail else title).hashCode() and 0xFFFFFF)
                      }
                      val open = Intent(ctx, MainActivity::class.java)
                      open.flags = Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_SINGLE_TOP or Intent.FLAG_ACTIVITY_CLEAR_TOP
                      if (dmEmail.isNotEmpty()) open.putExtra("open_dm_email", dmEmail)
                      val piFlags = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE else PendingIntent.FLAG_UPDATE_CURRENT
                      val pi = PendingIntent.getActivity(ctx, id, open, piFlags)
                      val channel = if (isCall) CH_CALL else if (isSiren) CH_SIREN else CH_ALERTS
                      val b = NotificationCompat.Builder(ctx, channel)
                          .setSmallIcon(ctx.applicationInfo.icon)
                          .setContentTitle(title)
                          .setContentText(body)
                          .setStyle(NotificationCompat.BigTextStyle().bigText(body))
                          .setPriority(NotificationCompat.PRIORITY_MAX)
                          .setVisibility(NotificationCompat.VISIBILITY_PUBLIC)
                          .setAutoCancel(true)
                          .setContentIntent(pi)
                          .setCategory(if (isCall) NotificationCompat.CATEGORY_CALL else if (isSiren) NotificationCompat.CATEGORY_ALARM else NotificationCompat.CATEGORY_MESSAGE)
                      if (isCall) {
                          b.setFullScreenIntent(pi, true)
                          b.setColor(Color.parseColor("#10B981"))
                          b.setTimeoutAfter(45000L)
                          b.addAction(android.R.drawable.sym_action_call, "Answer", pi)
                      }
                      if (Build.VERSION.SDK_INT < Build.VERSION_CODES.O) b.setDefaults(NotificationCompat.DEFAULT_ALL)
                      nm.notify(id, b.build())
                  } catch (e: Exception) {}
              }
          }
          """

          BRIDGE_REAL = r"""package com.sattapai.satta_pai

          import android.content.Context
          import com.google.firebase.messaging.FirebaseMessaging

          object SattaPaiFcmBridge {
              fun getToken(ctx: Context, cb: (String) -> Unit) {
                  try {
                      val prefs = ctx.getSharedPreferences("sp_fcm", Context.MODE_PRIVATE)
                      val cached = prefs.getString("token", "") ?: ""
                      FirebaseMessaging.getInstance().token.addOnCompleteListener { t ->
                          val tok = if (t.isSuccessful) (t.result ?: "") else cached
                          if (tok.isNotEmpty()) prefs.edit().putString("token", tok).apply()
                          cb(tok)
                      }
                  } catch (e: Exception) { cb("") }
              }
          }
          """

          BRIDGE_STUB = r"""package com.sattapai.satta_pai

          import android.content.Context

          object SattaPaiFcmBridge {
              fun getToken(ctx: Context, cb: (String) -> Unit) { cb("") }
          }
          """

          SERVICE = r"""package com.sattapai.satta_pai

          import android.content.Context
          import com.google.firebase.messaging.FirebaseMessagingService
          import com.google.firebase.messaging.RemoteMessage

          class SattaPaiFcmService : FirebaseMessagingService() {
              override fun onNewToken(token: String) {
                  super.onNewToken(token)
                  getSharedPreferences("sp_fcm", Context.MODE_PRIVATE).edit().putString("token", token).apply()
              }

              override fun onMessageReceived(message: RemoteMessage) {
                  super.onMessageReceived(message)
                  val d = message.data
                  SattaPaiNotifier.show(
                      applicationContext,
                      d["type"] ?: "generic",
                      d["title"] ?: message.notification?.title ?: "Satta Pai Esports",
                      d["body"] ?: message.notification?.body ?: "",
                      d["dmEmail"] ?: "",
                      d["matchId"] ?: ""
                  )
              }
          }
          """

          def w(name, body):
              with open(os.path.join(kt_dir, name), "w") as f: f.write(body)

          w("SattaPaiNotifier.kt", NOTIFIER)
          w("SattaPaiFcmBridge.kt", BRIDGE_REAL if enabled else BRIDGE_STUB)
          if enabled:
              w("SattaPaiFcmService.kt", SERVICE)
              mp = "android/app/src/main/AndroidManifest.xml"
              with open(mp) as f: mf = f.read()
              if "SattaPaiFcmService" not in mf:
                  svc = """
                  <service android:name=".SattaPaiFcmService" android:exported="false">
                      <intent-filter>
                          <action android:name="com.google.firebase.MESSAGING_EVENT"/>
                      </intent-filter>
                  </service>
          """
                  mf = mf.replace("</application>", svc + "    </application>", 1)
                  with open(mp, "w") as f: f.write(mf)
          print("FCM push enabled:", enabled)
