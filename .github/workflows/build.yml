name: Build Satta Pai APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  # 📌 HOW TO UPDATE APK VERSION (e.g. 1.0.0 -> 1.0.1):
  # Simply change APP_VERSION_NAME to "1.0.1" and increment APP_VERSION_CODE to "101"!
  APP_VERSION_NAME: "1.0.5"
  APP_VERSION_CODE: "105"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'

      - name: Create Flutter Project & Configure Production Native App
        run: |
          mkdir -p /tmp/web_backup
          if [ -f "app.html" ]; then
            cp app.html /tmp/web_backup/index.html
          else
            cp index.html /tmp/web_backup/index.html
          fi

          flutter create --org com.sattapai --project-name satta_pai app_build
          cd app_build

          mkdir -p assets/www
          cp /tmp/web_backup/index.html assets/www/index.html

          flutter pub add webview_flutter webview_flutter_android url_launcher shared_preferences

          python3 - << 'PYEOF'
          with open("pubspec.yaml", "r") as f:
              content = f.read()

          if "assets/www/" not in content:
              asset_block = "\n  assets:\n    - assets/www/index.html\n"
              if "uses-material-design: true" in content:
                  content = content.replace("uses-material-design: true", "uses-material-design: true" + asset_block, 1)
              else:
                  content += "\nflutter:\n  uses-material-design: true" + asset_block

          with open("pubspec.yaml", "w") as f:
              f.write(content)
          PYEOF

          python3 - << 'PYEOF'
          import re, base64, os, shutil, json

          with open("assets/www/index.html", "r", encoding="utf-8") as f:
              html = f.read()

          res_dir = "android/app/src/main/res"
          for root, dirs, files in os.walk(res_dir):
              for file in files:
                  if file.startswith("ic_launcher"):
                      os.remove(os.path.join(root, file))

          m = re.search(r'id="custom-app-logo-img"\s+src="data:image/[^;]+;base64,([^"]+)"', html)
          default_bytes = base64.b64decode(m.group(1)) if m else b""

          vip_icons = {}
          vm = re.search(r'window\.VIP_CUSTOM_APP_ICONS\s*=\s*(\{.*?\});', html)
          if vm:
              try:
                  parsed = json.loads(vm.group(1))
                  for k, v in parsed.items():
                      durl = v.get("dataUrl", "")
                      if "base64," in durl:
                          vip_icons[k] = base64.b64decode(durl.split("base64,", 1)[1])
              except Exception:
                  pass

          for folder in ["mipmap-mdpi", "mipmap-hdpi", "mipmap-xhdpi", "mipmap-xxhdpi", "mipmap-xxxhdpi"]:
              target_dir = os.path.join(res_dir, folder)
              os.makedirs(target_dir, exist_ok=True)
              main_icon = vip_icons.get("icon_cyan") or default_bytes
              if main_icon:
                  with open(os.path.join(target_dir, "ic_launcher.webp"), "wb") as out:
                      out.write(main_icon)
                  with open(os.path.join(target_dir, "ic_launcher_round.webp"), "wb") as out:
                      out.write(main_icon)
              for key in ["icon_cyan", "icon_gold", "icon_purple", "icon_fire"]:
                  ibytes = vip_icons.get(key) or main_icon
                  if ibytes:
                      with open(os.path.join(target_dir, f"ic_{key}.webp"), "wb") as out:
                          out.write(ibytes)
          PYEOF

          python3 - << 'PYEOF'
          manifest_path = "android/app/src/main/AndroidManifest.xml"
          with open(manifest_path, "r") as f:
              manifest = f.read()

          perms = """
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.VIBRATE"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <uses-permission android:name="android.permission.CAMERA"/>
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/>
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>
              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO"/>
              <queries>
                  <package android:name="com.dts.freefiremax"/>
                  <package android:name="com.dts.freefireth"/>
                  <package android:name="com.garena.game.ffi"/>
              </queries>
          """
          if "android.permission.INTERNET" not in manifest:
              manifest = manifest.replace("<application", perms + "\n    <application", 1)

          if 'android:usesCleartextTraffic="true"' not in manifest:
              manifest = manifest.replace("<application", '<application\n        android:usesCleartextTraffic="true"\n        android:hardwareAccelerated="true"\n        android:allowBackup="true"\n        android:fullBackupContent="true"', 1)

          manifest = manifest.replace('android:label="satta_pai"', 'android:label="Satta Pai"')

          aliases = """
              <activity-alias
                  android:name=".IconGoldAlias"
                  android:enabled="false"
                  android:exported="true"
                  android:icon="@mipmap/ic_icon_gold"
                  android:label="Satta Pai"
                  android:targetActivity=".MainActivity">
                  <intent-filter>
                      <action android:name="android.intent.action.MAIN"/>
                      <category android:name="android.intent.category.LAUNCHER"/>
                  </intent-filter>
              </activity-alias>
              <activity-alias
                  android:name=".IconPurpleAlias"
                  android:enabled="false"
                  android:exported="true"
                  android:icon="@mipmap/ic_icon_purple"
                  android:label="Satta Pai"
                  android:targetActivity=".MainActivity">
                  <intent-filter>
                      <action android:name="android.intent.action.MAIN"/>
                      <category android:name="android.intent.category.LAUNCHER"/>
                  </intent-filter>
              </activity-alias>
              <activity-alias
                  android:name=".IconFireAlias"
                  android:enabled="false"
                  android:exported="true"
                  android:icon="@mipmap/ic_icon_fire"
                  android:label="Satta Pai"
                  android:targetActivity=".MainActivity">
                  <intent-filter>
                      <action android:name="android.intent.action.MAIN"/>
                      <category android:name="android.intent.category.LAUNCHER"/>
                  </intent-filter>
              </activity-alias>
          """
          if "IconGoldAlias" not in manifest:
              manifest = manifest.replace("</application>", aliases + "\n    </application>", 1)

          with open(manifest_path, "w") as f:
              f.write(manifest)
          PYEOF

          python3 - << 'PYEOF'
          import os, glob

          kt_files = glob.glob("android/app/src/main/kotlin/**/MainActivity.kt", recursive=True)
          kt_path = kt_files[0] if kt_files else "android/app/src/main/kotlin/com/sattapai/satta_pai/MainActivity.kt"
          os.makedirs(os.path.dirname(kt_path), exist_ok=True)

          kt_code = r'''package com.sattapai.satta_pai

          import android.Manifest
          import android.accounts.AccountManager
          import android.app.Activity
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.content.ComponentName
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.graphics.Bitmap
          import android.graphics.BitmapFactory
          import android.provider.OpenableColumns
          import android.util.Base64
          import java.io.ByteArrayOutputStream
          import android.view.KeyEvent
          import android.view.WindowManager
          import android.widget.Toast
          import androidx.core.app.ActivityCompat
          import androidx.core.app.NotificationCompat
          import androidx.core.content.ContextCompat
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          import org.json.JSONObject
          import java.io.File
          import java.io.FileOutputStream

          class MainActivity: FlutterActivity() {
              private val CHANNEL = "satta_pai/native_auth"
              private val NOTIF_CHANNEL_ID = "satta_pai_esports_alerts"
              private var pendingResult: MethodChannel.Result? = null
              private var pendingFileResult: MethodChannel.Result? = null
              private val PICK_ACCOUNT_REQ = 9001
              private val REQ_POST_NOTIF = 9002
              private val PICK_FILE_REQ = 9003
              private val REQ_RECORD_AUDIO = 9004
              private var isVipDmSecureShieldActive = false

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  createNotificationChannelIfNeeded()
                  requestNotificationPermissionIfNeeded()
                  try {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
                          window.attributes.layoutInDisplayCutoutMode =
                              WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES
                      }
                      // Adaptive Refresh Rate: Let Android OS dynamically scale refresh rate (saves battery & prevents heating!)
                  } catch (e: Exception) {}
              }

              private fun requestNotificationPermissionIfNeeded() {
                  try {
                      if (Build.VERSION.SDK_INT >= 33) {
                          if (ContextCompat.checkSelfPermission(this, Manifest.permission.POST_NOTIFICATIONS)
                              != PackageManager.PERMISSION_GRANTED) {
                              ActivityCompat.requestPermissions(
                                  this,
                                  arrayOf(Manifest.permission.POST_NOTIFICATIONS),
                                  REQ_POST_NOTIF
                              )
                          }
                      }
                  } catch (e: Exception) {}
              }

              private fun ensureMicrophonePermission(): Boolean {
                  return try {
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO)
                          != PackageManager.PERMISSION_GRANTED) {
                          ActivityCompat.requestPermissions(
                              this,
                              arrayOf(Manifest.permission.RECORD_AUDIO),
                              REQ_RECORD_AUDIO
                          )
                          false
                      } else {
                          true
                      }
                  } catch (e: Exception) {
                      false
                  }
              }

              private fun createNotificationChannelIfNeeded() {
                  try {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          val nm = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                          val chan = NotificationChannel(
                              NOTIF_CHANNEL_ID,
                              "Satta Pai Arena Alerts & DMs",
                              NotificationManager.IMPORTANCE_HIGH
                          )
                          chan.description = "Private DM messages, Match Room Keys & App Update alerts"
                          chan.enableVibration(true)
                          nm.createNotificationChannel(chan)
                      }
                  } catch (e: Exception) {}
              }

              private fun showNativeNotification(title: String, body: String, notifId: Int) {
                  try {
                      createNotificationChannelIfNeeded()
                      val nm = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                      val intent = Intent(this, MainActivity::class.java).apply {
                          flags = Intent.FLAG_ACTIVITY_SINGLE_TOP or Intent.FLAG_ACTIVITY_CLEAR_TOP
                      }
                      val piFlags = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                          PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                      } else {
                          PendingIntent.FLAG_UPDATE_CURRENT
                      }
                      val pendingIntent = PendingIntent.getActivity(this, notifId, intent, piFlags)
                      val builder = NotificationCompat.Builder(this, NOTIF_CHANNEL_ID)
                          .setSmallIcon(applicationInfo.icon)
                          .setContentTitle(title)
                          .setContentText(body)
                          .setStyle(NotificationCompat.BigTextStyle().bigText(body))
                          .setPriority(NotificationCompat.PRIORITY_HIGH)
                          .setAutoCancel(true)
                          .setContentIntent(pendingIntent)
                      nm.notify(notifId, builder.build())
                  } catch (e: Exception) {}
              }

              private fun switchLauncherIcon(iconKey: String) {
                  try {
                      val pm = applicationContext.packageManager
                      val pkg = applicationContext.packageName
                      val components = mapOf(
                          "icon_cyan" to ComponentName(pkg, "$pkg.MainActivity"),
                          "icon_gold" to ComponentName(pkg, "$pkg.IconGoldAlias"),
                          "icon_purple" to ComponentName(pkg, "$pkg.IconPurpleAlias"),
                          "icon_fire" to ComponentName(pkg, "$pkg.IconFireAlias")
                      )
                      for ((k, comp) in components) {
                          val state = if (k == iconKey)
                              PackageManager.COMPONENT_ENABLED_STATE_ENABLED
                          else
                              PackageManager.COMPONENT_ENABLED_STATE_DISABLED
                          pm.setComponentEnabledSetting(comp, state, PackageManager.DONT_KILL_APP)
                      }
                  } catch (e: Exception) {}
              }

              private fun launchInstalledFreeFire(targetPkg: String): Boolean {
                  try {
                      val pm = applicationContext.packageManager
                      val candidates = listOf(targetPkg, "com.dts.freefiremax", "com.dts.freefireth", "com.garena.game.ffi")
                      for (pkg in candidates) {
                          val launchIntent = pm.getLaunchIntentForPackage(pkg)
                          if (launchIntent != null) {
                              launchIntent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                              startActivity(launchIntent)
                              return true
                          }
                      }
                      val marketIntent = Intent(Intent.ACTION_VIEW, Uri.parse("market://details?id=" + targetPkg))
                      marketIntent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                      startActivity(marketIntent)
                      return true
                  } catch (e: Exception) {
                      return false
                  }
              }

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, CHANNEL).setMethodCallHandler { call, result ->
                      when (call.method) {
                          "pickAccount" -> {
                              if (pendingResult != null) {
                                  pendingResult?.success("")
                                  pendingResult = null
                              }
                              pendingResult = result
                              try {
                                  val intent = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                                      AccountManager.newChooseAccountIntent(
                                          null, null, arrayOf("com.google"), null, null, null, null
                                      )
                                  } else {
                                      @Suppress("DEPRECATION")
                                      AccountManager.newChooseAccountIntent(
                                          null, null, arrayOf("com.google"), false, null, null, null, null
                                      )
                                  }
                                  startActivityForResult(intent, PICK_ACCOUNT_REQ)
                              } catch (e: Exception) {
                                  pendingResult = null
                                  result.success("")
                              }
                          }
                          "pickFile" -> {
                              if (pendingFileResult != null) {
                                  pendingFileResult?.success("")
                                  pendingFileResult = null
                              }
                              pendingFileResult = result
                              try {
                                  val mime = call.argument<String>("mime") ?: "*/*"
                                  val cleanMime = when {
                                      mime.contains("audio") -> "audio/*"
                                      mime.contains("image") -> "image/*"
                                      else -> "*/*"
                                  }
                                  val intent = Intent(Intent.ACTION_GET_CONTENT).apply {
                                      type = cleanMime
                                      addCategory(Intent.CATEGORY_OPENABLE)
                                  }
                                  startActivityForResult(Intent.createChooser(intent, "Select File"), PICK_FILE_REQ)
                              } catch (e: Exception) {
                                  pendingFileResult = null
                                  result.success("")
                              }
                          }
                          "requestMicPermission" -> {
                              val granted = ensureMicrophonePermission()
                              result.success(granted)
                          }
                          "launchFreeFire" -> {
                              val pkg = call.argument<String>("pkg") ?: "com.dts.freefiremax"
                              val ok = launchInstalledFreeFire(pkg)
                              result.success(ok)
                          }
                          "setAppIcon" -> {
                              val iconKey = call.argument<String>("icon") ?: "icon_cyan"
                              switchLauncherIcon(iconKey)
                              result.success(true)
                          }
                          "showNotification" -> {
                              val title = call.argument<String>("title") ?: "Satta Pai Esports"
                              val body = call.argument<String>("body") ?: ""
                              val id = call.argument<Int>("id") ?: (System.currentTimeMillis() % 100000).toInt()
                              showNativeNotification(title, body, id)
                              result.success(true)
                          }
                          "clearNotifications" -> {
                              try {
                                  val nm = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                                  nm.cancelAll()
                              } catch (e: Exception) {}
                              result.success(true)
                          }
                          "setScreenshotBlock" -> {
                              val enable = call.argument<Boolean>("enable") ?: false
                              isVipDmSecureShieldActive = enable
                              runOnUiThread {
                                  try {
                                      if (enable) {
                                          window.addFlags(WindowManager.LayoutParams.FLAG_SECURE)
                                      } else {
                                          window.clearFlags(WindowManager.LayoutParams.FLAG_SECURE)
                                      }
                                  } catch (e: Exception) {}
                              }
                              result.success(true)
                          }
                          else -> result.notImplemented()
                      }
                  }
              }

              override fun onKeyDown(keyCode: Int, event: KeyEvent?): Boolean {
                  if (isVipDmSecureShieldActive && (keyCode == KeyEvent.KEYCODE_SYSRQ || keyCode == KeyEvent.KEYCODE_CAPTIONS)) {
                      Toast.makeText(this, "Cannot take screenshot! PRO / PRO+ Privacy Shield Active.", Toast.LENGTH_SHORT).show()
                      return true
                  }
                  return super.onKeyDown(keyCode, event)
              }

              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == PICK_ACCOUNT_REQ) {
                      val res = pendingResult
                      pendingResult = null
                      if (resultCode == Activity.RESULT_OK && data != null) {
                          val email = data.getStringExtra(AccountManager.KEY_ACCOUNT_NAME) ?: ""
                          res?.success(email)
                      } else {
                          res?.success("")
                      }
                  } else if (requestCode == PICK_FILE_REQ) {
                      val res = pendingFileResult
                      pendingFileResult = null
                      if (resultCode == Activity.RESULT_OK && data?.data != null) {
                          try {
                              val uri = data.data!!
                              val mime = contentResolver.getType(uri) ?: "application/octet-stream"
                              var fileName = "picked_file_" + System.currentTimeMillis()
                              contentResolver.query(uri, null, null, null, null)?.use { cursor ->
                                  val nameIndex = cursor.getColumnIndex(OpenableColumns.DISPLAY_NAME)
                                  if (nameIndex >= 0 && cursor.moveToFirst()) {
                                      fileName = cursor.getString(nameIndex) ?: fileName
                                  }
                              }
                              val safeName = fileName.replace(Regex("[^a-zA-Z0-9._-]"), "_")
                              val tempFile = File(cacheDir, "sp_upload_" + safeName)
                              var rawBytes = contentResolver.openInputStream(uri)?.use { it.readBytes() } ?: ByteArray(0)
                              var finalMime = mime

                              // If it's an image, compress natively in Kotlin to <= 640px JPEG so it's < 80KB and never exceeds Android 1MB Binder IPC limit!
                              if (mime.startsWith("image/") && rawBytes.isNotEmpty()) {
                                  try {
                                      val bmp = BitmapFactory.decodeByteArray(rawBytes, 0, rawBytes.size)
                                      if (bmp != null) {
                                          val maxDim = 640
                                          val w = bmp.width
                                          val h = bmp.height
                                          val scaled = if (w > maxDim || h > maxDim) {
                                              val ratio = minOf(maxDim.toFloat() / w.toFloat(), maxDim.toFloat() / h.toFloat())
                                              Bitmap.createScaledBitmap(bmp, (w * ratio).toInt().coerceAtLeast(1), (h * ratio).toInt().coerceAtLeast(1), true)
                                          } else {
                                              bmp
                                          }
                                          val baos = ByteArrayOutputStream()
                                          scaled.compress(Bitmap.CompressFormat.JPEG, 82, baos)
                                          rawBytes = baos.toByteArray()
                                          finalMime = "image/jpeg"
                                      }
                                  } catch (e: Exception) {}
                              }

                              FileOutputStream(tempFile).use { it.write(rawBytes) }
                              val fileUriStr = Uri.fromFile(tempFile).toString()
                              // Only inline Base64 in JSON if <= 350KB; larger files (like MP3 songs) stream via local HttpServer /__picked_file!
                              val b64 = if (rawBytes.size <= 350 * 1024) {
                                  Base64.encodeToString(rawBytes, Base64.NO_WRAP)
                              } else ""
                              val json = JSONObject()
                              json.put("uri", fileUriStr)
                              json.put("path", tempFile.absolutePath)
                              json.put("name", safeName)
                              json.put("mime", finalMime)
                              json.put("dataUrl", if (b64.isNotEmpty()) "data:$finalMime;base64,$b64" else "")
                              res?.success(json.toString())
                          } catch (e: Exception) {
                              res?.success("")
                          }
                      } else {
                          res?.success("")
                      }
                  }
              }
          }
          '''
          with open(kt_path, "w") as f:
              f.write(kt_code)
          PYEOF

          python3 - << 'PYEOF'
          import os
          ver_name = os.environ.get("APP_VERSION_NAME", "1.0.0").strip() or "1.0.0"

          dart_code = r'''import 'dart:async';
          import 'dart:convert';
          import 'dart:io';
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';
          import 'package:shared_preferences/shared_preferences.dart';
          import 'package:webview_flutter/webview_flutter.dart';
          import 'package:webview_flutter_android/webview_flutter_android.dart';
          import 'package:url_launcher/url_launcher.dart';

          const String kCurrentNativeAppVersion = '__APP_VERSION_NAME__';
          const int kFixedLocalServerPort = 18765;

          void main() async {
            WidgetsFlutterBinding.ensureInitialized();
            SystemChrome.setSystemUIOverlayStyle(const SystemUiOverlayStyle(
              statusBarColor: Colors.transparent,
              statusBarIconBrightness: Brightness.light,
              systemNavigationBarColor: Color(0xFF0A0E17),
              systemNavigationBarIconBrightness: Brightness.light,
            ));
            runApp(const SattaPaiApp());
          }

          class SattaPaiApp extends StatelessWidget {
            const SattaPaiApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'Satta Pai',
                debugShowCheckedModeBanner: false,
                theme: ThemeData.dark().copyWith(
                  scaffoldBackgroundColor: const Color(0xFF0A0E17),
                ),
                home: const ArenaWebViewScreen(),
              );
            }
          }

          class ArenaWebViewScreen extends StatefulWidget {
            const ArenaWebViewScreen({super.key});

            @override
            State<ArenaWebViewScreen> createState() => _ArenaWebViewScreenState();
          }

          class _ArenaWebViewScreenState extends State<ArenaWebViewScreen> {
            WebViewController? _controller;
            HttpServer? _server;
            SharedPreferences? _prefs;
            bool _isReady = false;
            String _lastPickedFilePath = '';
            String _lastPickedFileMime = 'application/octet-stream';
            static const MethodChannel _authChannel = MethodChannel('satta_pai/native_auth');

            @override
            void initState() {
              super.initState();
              _startLocalServerAndWebView();
            }

            Future<void> _saveNativeAuthSession({
              required String email,
              String uid = '',
              String guest = '0',
              String appVersion = kCurrentNativeAppVersion,
            }) async {
              try {
                final prefs = _prefs ?? await SharedPreferences.getInstance();
                _prefs = prefs;
                await prefs.setString('sp_saved_email', email.trim().toLowerCase());
                if (uid.isNotEmpty) {
                  await prefs.setString('sp_saved_uid', uid.trim());
                }
                await prefs.setString('sp_saved_guest', guest);
                await prefs.setString('sp_saved_app_version', appVersion);
              } catch (e) {
                debugPrint('Error saving native auth prefs: ' + e.toString());
              }
            }

            Future<void> _clearNativeAuthSession() async {
              try {
                final prefs = _prefs ?? await SharedPreferences.getInstance();
                _prefs = prefs;
                await prefs.remove('sp_saved_email');
                await prefs.remove('sp_saved_uid');
                await prefs.remove('sp_saved_guest');
              } catch (e) {
                debugPrint('Error clearing native auth prefs: ' + e.toString());
              }
            }

            Future<void> _triggerNativePicker(String provider) async {
              try {
                final String? email = await _authChannel.invokeMethod<String>('pickAccount');
                if (email != null && email.trim().isNotEmpty && _controller != null) {
                  final String cleanEmail = email.trim().toLowerCase();
                  await _saveNativeAuthSession(
                    email: cleanEmail,
                    guest: '0',
                    appVersion: kCurrentNativeAppVersion,
                  );
                  final String safeEmail = jsonEncode(cleanEmail);
                  final String safeProv = jsonEncode(provider);
                  await _controller!.runJavaScript(
                    'if(window.onNativeAccountPicked){window.onNativeAccountPicked(' + safeEmail + ',' + safeProv + ');}'
                  );
                }
              } catch (e) {
                debugPrint('Native account picker error: ' + e.toString());
              }
            }

            String _buildHydratedHtml(String rawHtml) {
              String savedEmail = _prefs?.getString('sp_saved_email') ?? '';
              String savedUid = _prefs?.getString('sp_saved_uid') ?? '';
              String savedGuest = _prefs?.getString('sp_saved_guest') ?? '0';
              String savedVer = _prefs?.getString('sp_saved_app_version') ?? '';
              String savedMusicMuted = _prefs?.getString('sp_music_muted') ?? '';
              String savedMusicVol = _prefs?.getString('sp_music_volume') ?? '';

              if (savedVer.isNotEmpty && savedVer != kCurrentNativeAppVersion) {
                savedEmail = '';
                savedUid = '';
                savedGuest = '0';
                _clearNativeAuthSession();
                _prefs?.setString('sp_saved_app_version', kCurrentNativeAppVersion);
              } else if (savedVer.isEmpty && (savedEmail.isNotEmpty || savedGuest == '1')) {
                savedVer = kCurrentNativeAppVersion;
                _prefs?.setString('sp_saved_app_version', kCurrentNativeAppVersion);
              }

              final Map<String, String> bootPayload = {
                'email': savedEmail,
                'uid': savedUid,
                'guest': savedGuest,
                'appVersion': savedVer.isEmpty ? kCurrentNativeAppVersion : savedVer,
                'nativeBuildVersion': kCurrentNativeAppVersion,
                'musicMuted': savedMusicMuted,
                'musicVolume': savedMusicVol,
              };

              final String bootScript = '<script id="sp-native-boot-bridge">'
                  'window.__SP_NATIVE_STORAGE__ = ' + jsonEncode(bootPayload) + ';'
                  'window.CURRENT_APP_APK_VERSION = "' + kCurrentNativeAppVersion + '";'
                  'try {'
                  '  sessionStorage.setItem("sp_intro_shown_session", "1");'
                  '  sessionStorage.setItem("sp_intro_seen_session", "1");'
                  '  var _spN = window.__SP_NATIVE_STORAGE__;'
                  '  if (_spN && _spN.musicMuted) localStorage.setItem("satta_pai_music_muted", _spN.musicMuted);'
                  '  if (_spN && _spN.musicVolume) localStorage.setItem("satta_pai_music_volume", _spN.musicVolume);'
                  '  if (_spN && _spN.email && _spN.email.indexOf("@") !== -1) {'
                  '    localStorage.setItem("satta_pai_intro_completed", "1");'
                  '    localStorage.setItem("satta_pai_auth_email", _spN.email);'
                  '    localStorage.setItem("satta_pai_native_google_email", _spN.email);'
                  '    localStorage.setItem("satta_pai_logged_app_version", _spN.appVersion || "' + kCurrentNativeAppVersion + '");'
                  '    sessionStorage.setItem("satta_pai_auth_email", _spN.email);'
                  '    if (_spN.uid) localStorage.setItem("satta_pai_auth_uid", _spN.uid);'
                  '    window.loggedEmail = _spN.email;'
                  '    window._hasVerifiedAuthSession = true;'
                  '  } else if (_spN && _spN.guest === "1") {'
                  '    localStorage.setItem("satta_pai_intro_completed", "1");'
                  '    localStorage.setItem("satta_pai_guest_session", "1");'
                  '    localStorage.setItem("satta_pai_logged_app_version", _spN.appVersion || "' + kCurrentNativeAppVersion + '");'
                  '    sessionStorage.setItem("satta_pai_guest_session", "1");'
                  '    window.loggedEmail = "guest";'
                  '  }'
                  '} catch(e) {}'
                  '</script>';

              if (rawHtml.contains('<head>')) {
                return rawHtml.replaceFirst('<head>', '<head>' + bootScript);
              }
              return bootScript + rawHtml;
            }

            Future<void> _startLocalServerAndWebView() async {
              try {
                _prefs = await SharedPreferences.getInstance();
                final indexHtml = await rootBundle.loadString('assets/www/index.html');

                try {
                  _server = await HttpServer.bind(
                    InternetAddress.loopbackIPv4,
                    kFixedLocalServerPort,
                    shared: true,
                  );
                } catch (_) {
                  _server = await HttpServer.bind(InternetAddress.loopbackIPv4, 0);
                }
                final int port = _server!.port;

                _server!.listen((HttpRequest req) async {
                  req.response.headers.set('Access-Control-Allow-Origin', '*');
                  req.response.headers.set('Cache-Control', 'no-store');
                  if (req.uri.path == '/__picked_file' && _lastPickedFilePath.isNotEmpty) {
                    try {
                      final f = File(_lastPickedFilePath);
                      if (await f.exists()) {
                        req.response.headers.set('Content-Type', _lastPickedFileMime);
                        await req.response.addStream(f.openRead());
                        await req.response.close();
                        return;
                      }
                    } catch (_) {}
                    req.response.statusCode = 404;
                    await req.response.close();
                    return;
                  }
                  req.response.headers.contentType = ContentType.html;
                  req.response.write(_buildHydratedHtml(indexHtml));
                  await req.response.close();
                });

                final controller = WebViewController()
                  ..setJavaScriptMode(JavaScriptMode.unrestricted)
                  ..setBackgroundColor(const Color(0xFF0A0E17))
                  ..setUserAgent('Mozilla/5.0 (Linux; Android 14; Pixel 8 Pro) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Mobile Safari/537.36 SattaPaiApp/' + kCurrentNativeAppVersion)
                  ..addJavaScriptChannel(
                    'SattaPaiNativeAuth',
                    onMessageReceived: (JavaScriptMessage message) async {
                      final msg = message.message;
                      if (msg.startsWith('pick_account:')) {
                        final provider = msg.substring('pick_account:'.length);
                        await _triggerNativePicker(provider.isEmpty ? 'Google' : provider);
                      } else if (msg.startsWith('open_browser:')) {
                        final targetUrl = msg.substring('open_browser:'.length).trim();
                        if (targetUrl.isNotEmpty) {
                          await launchUrl(Uri.parse(targetUrl), mode: LaunchMode.externalApplication);
                        }
                      } else if (msg.startsWith('notify:')) {
                        try {
                          final payloadStr = msg.substring('notify:'.length);
                          final Map<String, dynamic> data = jsonDecode(payloadStr);
                          await _authChannel.invokeMethod('showNotification', {
                            'title': (data['title'] ?? 'Satta Pai Esports').toString(),
                            'body': (data['body'] ?? '').toString(),
                            'id': data['id'] is int ? data['id'] : (DateTime.now().millisecondsSinceEpoch % 100000),
                          });
                        } catch (e) {
                          debugPrint('notify error: ' + e.toString());
                        }
                      } else if (msg.startsWith('save_audio_prefs:')) {
                        try {
                          final payloadStr = msg.substring('save_audio_prefs:'.length);
                          final Map<String, dynamic> data = jsonDecode(payloadStr);
                          final prefs = _prefs ?? await SharedPreferences.getInstance();
                          if (data.containsKey('muted')) {
                            await prefs.setString('sp_music_muted', (data['muted'] ?? '0').toString());
                          }
                          if (data.containsKey('volume')) {
                            await prefs.setString('sp_music_volume', (data['volume'] ?? '0.8').toString());
                          }
                        } catch (e) {}
                      } else if (msg.startsWith('save_auth:')) {
                        try {
                          final payloadStr = msg.substring('save_auth:'.length);
                          final Map<String, dynamic> data = jsonDecode(payloadStr);
                          await _saveNativeAuthSession(
                            email: (data['email'] ?? '').toString(),
                            uid: (data['uid'] ?? '').toString(),
                            guest: (data['guest'] ?? '0').toString(),
                            appVersion: (data['appVersion'] ?? kCurrentNativeAppVersion).toString(),
                          );
                        } catch (e) {
                          debugPrint('save_auth parse error: ' + e.toString());
                        }
                      } else if (msg == 'clear_auth') {
                        await _clearNativeAuthSession();
                      } else if (msg == 'clear_notifications') {
                        await _authChannel.invokeMethod('clearNotifications');
                      } else if (msg.startsWith('launch_pkg:')) {
                        final pkg = msg.substring('launch_pkg:'.length).trim();
                        await _authChannel.invokeMethod('launchFreeFire', {'pkg': pkg});
                      } else if (msg.startsWith('set_app_icon:')) {
                        final iconKey = msg.substring('set_app_icon:'.length).trim();
                        await _authChannel.invokeMethod('setAppIcon', {'icon': iconKey});
                      } else if (msg.startsWith('set_screenshot_block:')) {
                        final flag = msg.substring('set_screenshot_block:'.length).trim();
                        final enable = (flag == '1' || flag == 'true');
                        await _authChannel.invokeMethod('setScreenshotBlock', {'enable': enable});
                      } else if (msg == 'request_mic_perm') {
                        await _authChannel.invokeMethod('requestMicPermission');
                      } else if (msg.startsWith('pick_file:')) {
                        try {
                          final rest = msg.substring('pick_file:'.length);
                          final parts = rest.split('|');
                          final inputId = parts.isNotEmpty ? parts[0] : '';
                          final mime = parts.length > 1 ? parts[1] : '*/*';
                          final String? resJson = await _authChannel.invokeMethod<String>('pickFile', {'mime': mime});
                          if (resJson != null && resJson.isNotEmpty && _controller != null) {
                            final Map<String, dynamic> fObj = jsonDecode(resJson);
                            final String dUrl = (fObj['dataUrl'] ?? '').toString();
                            final String fPath = (fObj['path'] ?? '').toString();
                            final String fName = (fObj['name'] ?? 'file').toString();
                            final String fMime = (fObj['mime'] ?? 'application/octet-stream').toString();
                            if (fPath.isNotEmpty) {
                              _lastPickedFilePath = fPath;
                              _lastPickedFileMime = fMime;
                            }
                            final String httpUrl = 'http://127.0.0.1:' + port.toString() + '/__picked_file?t=' + DateTime.now().millisecondsSinceEpoch.toString();
                            await _controller!.runJavaScript(
                              'if(window.onNativeFilePicked){window.onNativeFilePicked(' +
                                  jsonEncode(inputId) + ',' +
                                  jsonEncode(fName) + ',' +
                                  jsonEncode(fMime) + ',' +
                                  jsonEncode(dUrl) + ',' +
                                  jsonEncode(httpUrl) + ');}'
                            );
                          }
                        } catch (e) {
                          debugPrint('pick_file error: ' + e.toString());
                        }
                      } else {
                        await _triggerNativePicker('Google');
                      }
                    },
                  )
                  ..setNavigationDelegate(
                    NavigationDelegate(
                      onNavigationRequest: (NavigationRequest request) {
                        final url = request.url;
                        if (url.startsWith('upi://') ||
                            url.startsWith('whatsapp://') ||
                            url.startsWith('intent://') ||
                            url.startsWith('freefire://') ||
                            url.startsWith('freefiremax://') ||
                            url.startsWith('market://') ||
                            url.startsWith('mailto:') ||
                            url.startsWith('tel:') ||
                            url.endsWith('.apk') ||
                            url.contains('github.com/login/oauth') ||
                            url.contains('facebook.com/v') ||
                            url.contains('facebook.com/dialog/oauth') ||
                            url.contains('drive.google.com') ||
                            url.contains('mediafire.com') ||
                            url.contains('mega.nz') ||
                            url.contains('t.me/')) {
                          launchUrl(Uri.parse(url), mode: LaunchMode.externalApplication);
                          return NavigationDecision.prevent;
                        }
                        return NavigationDecision.navigate;
                      },
                    ),
                  );

                if (controller.platform is AndroidWebViewController) {
                  AndroidWebViewController.enableDebugging(false);
                  final androidCtrl = controller.platform as AndroidWebViewController;
                  androidCtrl.setMediaPlaybackRequiresUserGesture(false);
                  androidCtrl.setOnPlatformPermissionRequest((PlatformWebViewPermissionRequest request) {
                    request.grant();
                  });
                  androidCtrl.setOnShowFileSelector((FileSelectorParams params) async {
                    try {
                      final accept = params.acceptTypes.isNotEmpty ? params.acceptTypes.join(',') : '*/*';
                      final String? resJson = await _authChannel.invokeMethod<String>('pickFile', {'mime': accept});
                      if (resJson != null && resJson.isNotEmpty) {
                        final Map<String, dynamic> fObj = jsonDecode(resJson);
                        final String uriStr = (fObj['uri'] ?? '').toString();
                        final String dUrl = (fObj['dataUrl'] ?? '').toString();
                        final String fName = (fObj['name'] ?? 'file').toString();
                        final String fMime = (fObj['mime'] ?? 'application/octet-stream').toString();
                        if (dUrl.isNotEmpty && _controller != null) {
                          await _controller!.runJavaScript(
                            'if(window.onNativeFilePicked){window.onNativeFilePicked(window._lastClickedFileInputId||"",' +
                                jsonEncode(fName) + ',' +
                                jsonEncode(fMime) + ',' +
                                jsonEncode(dUrl) + ');}'
                          );
                        }
                        if (uriStr.isNotEmpty) {
                          return <String>[uriStr];
                        }
                      }
                    } catch (e) {
                      debugPrint('FileSelector error: ' + e.toString());
                    }
                    return <String>[];
                  });
                }

                final String localUrl = 'http://127.0.0.1:' + port.toString() + '/index.html';
                await controller.loadRequest(Uri.parse(localUrl));

                if (mounted) {
                  setState(() {
                    _controller = controller;
                    _isReady = true;
                  });
                }
              } catch (e) {
                debugPrint('Error starting WebView: ' + e.toString());
              }
            }

            @override
            void dispose() {
              _server?.close(force: true);
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              return PopScope(
                canPop: false,
                onPopInvoked: (bool didPop) async {
                  if (didPop) return;
                  if (_controller != null && await _controller!.canGoBack()) {
                    await _controller!.goBack();
                  }
                },
                child: Scaffold(
                  backgroundColor: const Color(0xFF0A0E17),
                  body: SafeArea(
                    child: _isReady && _controller != null
                        ? WebViewWidget(controller: _controller!)
                        : const Center(
                            child: CircularProgressIndicator(color: Color(0xFF00F2FE)),
                          ),
                  ),
                ),
              );
            }
          }
          '''.replace('__APP_VERSION_NAME__', ver_name)
          with open("lib/main.dart", "w") as f:
              f.write(dart_code)
          PYEOF

                    # 🔐 PERMANENT STATIC SIGNING KEYSTORE (Prevents "App not installed as package conflicts with an existing package"!)
          # By writing the exact same binary keystore to ~/.android/debug.keystore on every GitHub Actions run,
          # every APK ever built has the 100% identical RSA SHA-256 certificate signature forever!
          mkdir -p ~/.android
          echo "" | base64 -d > ~/.android/debug.keystore
          cp ~/.android/debug.keystore android/app/debug.keystore

          # Auto-increment build number on every GitHub Actions run so Android always allows in-place APK Update!
          AUTO_BUILD_NUMBER=$((1000 + ${GITHUB_RUN_NUMBER:-1}))
          echo "Building APK v${APP_VERSION_NAME} (versionCode: ${AUTO_BUILD_NUMBER})..."

          flutter build apk --release --build-name="${APP_VERSION_NAME}" --build-number="${AUTO_BUILD_NUMBER}"

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Satta-Pai-Release-APK
          path: app_build/build/app/outputs/flutter-apk/app-release.apk
