                        final String fName = (fObj['name'] ?? 'file').toString();
                        final String fMime = (fObj['mime'] ?? 'application/octet-stream').toString();
                        if (dUrl.isNotEmpty && _controller != null) {
                          await _controller!.runJavaScript(
                            'if(window.onNativeFilePicked){window.onNativeFilePicked(window._lastClickedFileInputId||"",' +
                                jsonEncode(fName) + ',' +
                                jsonEncode(fMime) + ',' +
                                jsonEncode(dUrl) + ');}'
                          );
                        }
                        if (uriStr.isNotEmpty) {
                          return <String>[uriStr];
                        }
                      }
                    } catch (e) {
                      debugPrint('FileSelector error: ' + e.toString());
                    }
                    return <String>[];
                  });
                }

                await controller.clearCache();
                final String localUrl = 'http://127.0.0.1:' + port.toString() + '/index.html?v=' + kCurrentNativeAppVersion + '_' + DateTime.now().millisecondsSinceEpoch.toString();
                await controller.loadRequest(Uri.parse(localUrl));
                Future.delayed(const Duration(milliseconds: 900), () => _checkPendingNotificationDeepLink());
                Future.delayed(const Duration(milliseconds: 2500), () => _pushFcmTokenToWeb());

                if (mounted) {
                  setState(() {
                    _controller = controller;
                    _isReady = true;
                  });
                }
              } catch (e) {
                debugPrint('Error starting WebView: ' + e.toString());
              }
            }

            @override
            void dispose() {
              WidgetsBinding.instance.removeObserver(this);
              _server?.close(force: true);
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              return PopScope(
                canPop: false,
                onPopInvoked: (bool didPop) async {
                  if (didPop) return;
                  if (_controller != null && await _controller!.canGoBack()) {
                    await _controller!.goBack();
                  }
                },
                child: Scaffold(
                  backgroundColor: const Color(0xFF0A0E17),
                  body: SafeArea(
                    child: _isReady && _controller != null
                        ? WebViewWidget(controller: _controller!)
                        : const Center(
                            child: CircularProgressIndicator(color: Color(0xFF00F2FE)),
                          ),
                  ),
                ),
              );
            }
          }
          '''.replace('__APP_VERSION_NAME__', ver_name)
          with open("lib/main.dart", "w") as f:
