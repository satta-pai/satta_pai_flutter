name: Build Satta Pai Official Hybrid App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Native Hybrid App
        run: |
          set -e
          # 1. Clean old files
          rm -rf lib android ios web test build pubspec.yaml pubspec.lock

          # 2. Create Flutter project
          flutter create . --project-name satta_pai_arena --platforms=android
          rm -rf test/widget_test.dart
          flutter pub add webview_flutter url_launcher

          # 3. Embed index.html directly from repository root
          mkdir -p assets/www
          if [ -f "index.html" ]; then
            cp -f index.html assets/www/index.html
          else
            echo "<h1>Satta Pai Loading...</h1>" > assets/www/index.html
          fi

          # 4. Generate & apply Satta Pai Dart engine & Android config
          python3 - << 'PYEOF'
          import os, re

          # Register assets in pubspec.yaml
          with open("pubspec.yaml", "r") as f:
              pub = f.read()
          if "assets/www/index.html" not in pub:
              pub = pub.replace("uses-material-design: true", "uses-material-design: true\n  assets:\n    - assets/www/index.html")
          with open("pubspec.yaml", "w") as f:
              f.write(pub)

          # Satta Pai Hybrid Dart Engine
          main_dart = '''import 'dart:async';
          import 'dart:io';
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';
          import 'package:webview_flutter/webview_flutter.dart';
          import 'package:url_launcher/url_launcher.dart';

          void main() async {
            WidgetsFlutterBinding.ensureInitialized();
            SystemChrome.setSystemUIOverlayStyle(const SystemUiOverlayStyle(
              statusBarColor: Color(0xFF05070B),
              statusBarIconBrightness: Brightness.light,
            ));
            runApp(const MaterialApp(
              title: 'Satta Pai',
              debugShowCheckedModeBanner: false,
              home: SattaPaiArenaShell(),
            ));
          }

          class SattaPaiArenaShell extends StatefulWidget {
            const SattaPaiArenaShell({super.key});
            @override
            State<SattaPaiArenaShell> createState() => _SattaPaiArenaShellState();
          }

          class _SattaPaiArenaShellState extends State<SattaPaiArenaShell> {
            WebViewController? _controller;
            HttpServer? _localServer;
            bool _ready = false;

            @override
            void initState() {
              super.initState();
              _initArena();
            }

            Future<void> _initArena() async {
              try {
                final html = await rootBundle.loadString('assets/www/index.html');
                _localServer = await HttpServer.bind(InternetAddress.loopbackIPv4, 8765, shared: true);
                _localServer!.listen((req) async {
                  req.response.headers.contentType = ContentType.html;
                  req.response.headers.add('Access-Control-Allow-Origin', '*');
                  req.response.write(html);
                  await req.response.close();
                });
                final c = WebViewController()
                  ..setJavaScriptMode(JavaScriptMode.unrestricted)
                  ..setBackgroundColor(const Color(0xFF05070B))
                  ..setUserAgent('Mozilla/5.0 (Linux; Android 14) Chrome/125.0.0.0 Mobile')
                  ..setNavigationDelegate(NavigationDelegate(
                    onNavigationRequest: (req) {
                      final u = req.url;
                      if (u.startsWith('intent://') || u.startsWith('freefire://') || u.startsWith('upi://') || u.startsWith('whatsapp://') || u.startsWith('tg://')) {
                        launchUrl(Uri.parse(u), mode: LaunchMode.externalApplication);
                        return NavigationDecision.prevent;
                      }
                      return NavigationDecision.navigate;
                    },
                  ))
                  ..loadRequest(Uri.parse('http://localhost:8765/index.html'));
                if (mounted) setState(() { _controller = c; _ready = true; });
              } catch (_) {}
            }

            @override
            void dispose() {
              _localServer?.close(force: true);
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              return WillPopScope(
                onWillPop: () async {
                  if (_controller != null && await _controller!.canGoBack()) {
                    await _controller!.goBack();
                    return false;
                  }
                  return true;
                },
                child: Scaffold(
                  backgroundColor: const Color(0xFF05070B),
                  body: SafeArea(
                    child: _ready && _controller != null
                        ? WebViewWidget(controller: _controller!)
                        : const Center(child: CircularProgressIndicator(color: Color(0xFF00FFFF))),
                  ),
                ),
              );
            }
          }
          '''
          with open("lib/main.dart", "w") as f:
              f.write(main_dart)

          # Manifest Internet & Intent Permissions
          mf_path = "android/app/src/main/AndroidManifest.xml"
          with open(mf_path, "r") as f:
              mf = f.read()
          perms = '''
          <uses-permission android:name="android.permission.INTERNET"/>
          <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
          <queries>
              <package android:name="com.dts.freefiremax" />
              <package android:name="com.dts.freefireth" />
              <package android:name="com.garena.game.ffi" />
              <package android:name="com.whatsapp" />
              <package android:name="org.telegram.messenger" />
          </queries>
          '''
          mf = mf.replace("<application", perms + "\n    <application", 1)
          mf = re.sub(r'android:label="[^"]*"', 'android:label="Satta Pai"', mf)
          mf = mf.replace("<application", '<application\n        android:usesCleartextTraffic="true"', 1)
          with open(mf_path, "w") as f:
              f.write(mf)
          PYEOF

          # 5. Build Release APK
          flutter pub get
          flutter build apk --release

      - name: Downloadable Satta Pai APK
        uses: actions/upload-artifact@v4
        with:
          name: Satta-Pai-Official-APK
          path: build/app/outputs/flutter-apk/app-release.apk
